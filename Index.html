function budgetPercent(key){return Number((db.settings.budget.groups.find(g=>g.key===key)||{}).percent)||0;}
function budgetIncome(month){
  // Receita base do orçamento: somente contas que aparecem no Resumo e sem transferências.
  const b=db.settings.budget;
  if(b.incomeMode==='manual') return Number(b.manualIncome)||0;
  const visible=new Set(summaryAccounts().map(a=>String(a.id)));
  return (db.transactions||[])
    .filter(t=>t.type==='receita'&&!t.transfer&&monthKey(t.date)===month&&visible.has(String(t.accountId)))
    .filter(t=>b.incomeMode==='expected'||t.confirmed===true)
    .reduce((s,t)=>s+Number(t.value||0),0);
}
function budgetSpending(month){
  // Realizado = despesas confirmadas; Comprometido = confirmadas + pendentes do mês.
  const out={};BUDGET_GROUPS_DEFAULT.forEach(g=>out[g.key]={confirmed:0,total:0});out['']={confirmed:0,total:0};
  (db.transactions||[]).filter(t=>t.type==='despesa'&&!t.transfer&&txCashMonth(t)===month).forEach(t=>{
    const c=db.categories.find(x=>String(x.id)===String(t.categoryId));
    const k=(c&&c.budgetGroup&&out[c.budgetGroup])?c.budgetGroup:'';
    const v=Number(t.value||0);
    out[k].total+=v; if(t.confirmed===true) out[k].confirmed+=v;
  });
  // Transferências para contas marcadas como "conta de investimentos" contam como aporte.
  (db.transfers||[]).filter(tr=>monthKey(tr.date)===month).forEach(tr=>{
    const to=db.accounts.find(a=>String(a.id)===String(tr.to)), from=db.accounts.find(a=>String(a.id)===String(tr.from));
    if(to?.investmentAccount&&!from?.investmentAccount){const v=Number(tr.value||0);out.investimentos.total+=v;out.investimentos.confirmed+=v;}
  });
  return out;
}

  const totPlanned=income*sumPct/100, totConf=Object.values(spend).reduce((s,x)=>s+x.confirmed,0), totAll=Object.values(spend).reduce((s,x)=>s+x.total,0);
  return `<div class="card section">
    <h2>📊 Divisão do orçamento — ${monthLabel(month)}</h2>
    <p class="muted" style="margin-top:0">Defina o percentual da receita mensal destinado a cada grupo. Cada categoria de despesa (Alimentação, Moradia, Transporte etc.) continua existindo e passa a ser vinculada a um desses grupos. Padrão sugerido: Custos fixos 30%, Conforto 15%, Metas 15%, Prazeres 10%, Investimentos 25% e Conhecimento 5%.</p>
    <form onsubmit="saveBudgetSettings(event)">
      <div class="budget-income">
        <label>Receita base do orçamento
          <select id="budgetIncomeMode" onchange="document.getElementById('budgetManualWrap').style.display=this.value==='manual'?'grid':'none'">
            <option value="expected" ${b.incomeMode==='expected'?'selected':''}>Previstas (confirmadas + pendentes)</option>
            <option value="confirmed" ${b.incomeMode==='confirmed'?'selected':''}>Somente confirmadas</option>
            <option value="manual" ${b.incomeMode==='manual'?'selected':''}>Valor fixo informado</option>
          </select>
        </label>
        <label id="budgetManualWrap" style="display:${b.incomeMode==='manual'?'grid':'none'}">Receita mensal fixa (R$)
          <input inputmode="decimal" data-decimal="true" autocomplete="off" type="text" id="budgetManualIncome" data-min="0" value="${decimalInputValue(b.manualIncome||'')}">

        ${rows}${unRow}
        <tr><td><b>Total</b></td><td><span id="budgetPctTotal" class="${pctOk?'budget-total-ok':'budget-total-bad'}">${sumPct.toFixed(1)} %</span></td><td><b>${money(totPlanned)}</b></td><td class="red"><b>${money(totConf)}</b></td><td><b>${money(totAll)}</b></td><td class="${totPlanned-totAll<0?'red':'blue'}"><b>${totPlanned-totAll<0?'− ':''}${money(Math.abs(totPlanned-totAll))}</b></td><td></td></tr>

function budgetPctLive(){
  let sum=0;document.querySelectorAll('.budget-pct').forEach(i=>sum+=parseDecimalBR(i.value)||0);
  const el=document.getElementById('budgetPctTotal');if(!el)return;
  el.textContent=sum.toFixed(1)+' %';
  el.className=Math.abs(sum-100)<0.005?'budget-total-ok':'budget-total-bad';
}
function saveBudgetSettings(e){
  e.preventDefault();
  const b=db.settings.budget;
  const pcts={};let sum=0,invalid=false;
  document.querySelectorAll('.budget-pct').forEach(i=>{const v=parseDecimalBR(i.value);if(!Number.isFinite(v)||v<0||v>100)invalid=true;pcts[i.dataset.key]=v;sum+=v||0;});
  if(invalid)return toast('Informe percentuais entre 0 e 100.');
  if(Math.abs(sum-100)>=0.005&&!confirm(`A soma dos percentuais é ${sum.toFixed(1)}% (diferente de 100%).\n\nDeseja salvar mesmo assim?`))return;
  b.groups.forEach(g=>{if(pcts[g.key]!==undefined)g.percent=pcts[g.key];});
  b.incomeMode=document.getElementById('budgetIncomeMode').value;
  b.manualIncome=parseDecimalBR(document.getElementById('budgetManualIncome')?.value)||0;
  if(b.incomeMode==='manual'&&!(b.manualIncome>0))return toast('Informe a receita mensal fixa.');
  save();toast('Divisão do orçamento salva');render();
}
function resetBudgetDefaults(){
  if(!confirm('Restaurar os percentuais padrão?\n\nCustos fixos 30% · Conforto 15% · Metas 15% · Prazeres 10% · Investimentos 25% · Conhecimento 5%'))return;
  db.settings.budget.groups=BUDGET_GROUPS_DEFAULT.map(g=>({key:g.key,percent:g.percent}));
  save();toast('Percentuais padrão restaurados');render();
}
function setCategoryBudgetGroup(id,key){
  const c=db.categories.find(x=>String(x.id)===String(id));if(!c)return;
  c.budgetGroup=budgetGroupDef(key)?key:'';
  save();render();
}
function suggestBudgetGroupKey(name){
  const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
  if(/invest|aporte|previdencia|tesouro|acoes|fii|cdb|poupanca|reserva/.test(n))return 'investimentos';
  if(/curso|livro|idioma|ingles|treinamento|certific|conhecimento|mentoria|pos-graduacao|especializacao/.test(n))return 'conhecimento';
  if(/viagem|meta|objetivo|reforma|construcao/.test(n))return 'metas';
  if(/assinatura|streaming|diarista|conforto|aplicativo|academia/.test(n))return 'conforto';
  if(/lazer|restaurante|bar|cinema|show|hobby|presente|brinquedo|delivery|salao|roupa|passeio|festa/.test(n))return 'prazeres';
  if(/moradia|aluguel|condominio|agua|luz|energia|gas|internet|telefone|iptu|ipva|financiamento|emprestimo|consignado|seguro|saude|plano|farmacia|medic|alimentacao|mercado|transporte|combustivel|escola|tarifa/.test(n))return 'custos_fixos';
  return '';
}
function suggestBudgetGroups(){
  const pend=db.categories.filter(c=>c.type==='despesa'&&!c.budgetGroup);
  const sug=pend.map(c=>({c,k:suggestBudgetGroupKey(c.name)})).filter(x=>x.k);
  if(!sug.length)return toast('Nenhuma sugestão disponível para as categorias sem grupo.');
  const list=sug.map(x=>`• ${x.c.name} → ${budgetGroupDef(x.k).name}`).join('\n');
  if(!confirm(`Aplicar as sugestões abaixo? Somente categorias SEM grupo serão alteradas.\n\n${list}\n\nVocê pode ajustar qualquer uma depois.`))return;
  sug.forEach(x=>x.c.budgetGroup=x.k);
  save();toast(`${sug.length} categoria(s) vinculada(s)`);render();
}
function budgetGroupSelect(c){
  return `<select title="Grupo do orçamento" onchange="setCategoryBudgetGroup(${c.id},this.value)"><option value="">❔ Sem grupo</option>${BUDGET_GROUPS_DEFAULT.map(g=>`<option value="${g.key}" ${c.budgetGroup===g.key?'selected':''}>${g.icon} ${esc(g.name)}</option>`).join('')}</select>`;
}

function goalAllocated(g){return (g.deposits||[]).reduce((s,d)=>s+Number(d.value||0),0);}
function goalProgress(g){const t=Number(g.target)||0;return t>0?Math.min(100,goalAllocated(g)/t*100):(goalAllocated(g)>0?100:0);}
function goalMonthAllocated(month){
  return (db.goals||[]).reduce((s,g)=>s+(g.deposits||[]).filter(d=>monthKey(d.date)===month).reduce((x,d)=>x+Number(d.value||0),0),0);
}
// Ritmo médio dos últimos 6 meses com aporte, usado para estimar a conclusão.
function goalMonthlyPace(g){
  const byMonth={};
  (g.deposits||[]).forEach(d=>{const k=monthKey(d.date);if(k)byMonth[k]=(byMonth[k]||0)+Number(d.value||0);});
  const months=Object.keys(byMonth).sort().slice(-6);
  if(!months.length)return 0;
  return months.reduce((s,k)=>s+byMonth[k],0)/months.length;
}
function goalForecast(g){
  const falta=Math.max(0,(Number(g.target)||0)-goalAllocated(g));
  if(falta<=0)return {falta:0,texto:'Meta alcançada'};
  const pace=goalMonthlyPace(g);
  if(pace<=0)return {falta,texto:'Registre aportes para estimar a conclusão'};
  const meses=Math.ceil(falta/pace);
  const d=new Date();d.setMonth(d.getMonth()+meses);
  return {falta,meses,texto:`No ritmo atual (${money(pace)}/mês): ~${meses} ${meses===1?'mês':'meses'}, até ${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}`};
}
function goalDeadlineInfo(g){
  if(!g.deadline)return null;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const alvo=new Date(g.deadline+'T12:00:00');
  const meses=Math.max(0,(alvo.getFullYear()-hoje.getFullYear())*12+(alvo.getMonth()-hoje.getMonth()));
  const falta=Math.max(0,(Number(g.target)||0)-goalAllocated(g));
  const porMes=meses>0?falta/meses:falta;
  const atrasada=alvo<hoje&&falta>0;
  return {alvo,meses,falta,porMes,atrasada};
}

function saveGoal(e,id){
  e.preventDefault();

  const target=parseDecimalBR(f.get('target'));
  if(name.length<2)return toast('Informe um nome para a meta.');
  if(!Number.isFinite(target)||target<=0)return toast('Informe um valor de objetivo maior que zero.');
  const data={name,target,deadline:String(f.get('deadline')||''),icon:f.get('icon')||'🎯',color:f.get('color')||'#8b5cf6',note:String(f.get('note')||'').trim()};
  if(id){Object.assign(db.goals.find(x=>x.id==id),data);}
  else db.goals.push({id:uid(),...data,done:false,deposits:[],order:db.goals.length});
  save();closeModal();toast(id?'Meta alterada':'Meta criada');render();
}
function deleteGoal(id){
  const g=db.goals.find(x=>x.id==id);if(!g)return;

function saveGoalDeposit(e,goalId){
  e.preventDefault();
  const g=db.goals.find(x=>x.id==goalId);if(!g)return;
  const f=new FormData(e.target);
  const value=parseDecimalBR(f.get('value'));
  if(!Number.isFinite(value)||value===0)return toast('Informe um valor diferente de zero.');
  const date=String(f.get('date')||'');
  if(!date)return toast('Informe a data do aporte.');
  g.deposits=Array.isArray(g.deposits)?g.deposits:[];
  g.deposits.push({id:uid(),date,value,note:String(f.get('note')||'').trim()});
  const total=goalAllocated(g);
  if(!g.done&&total>=(Number(g.target)||0)&&(Number(g.target)||0)>0){
    if(confirm(`Com este aporte você alcançou ${money(total)} de ${money(g.target)}.\n\nDeseja marcar a meta "${g.name}" como alcançada?`))g.done=true;
  }
  save();closeModal();
  toast(value>0?`${money(value)} guardado em "${g.name}"`:`${money(Math.abs(value))} retirado de "${g.name}"`);
  render();
}

function configuredDueDay(){
  const current=Number(db.settings?.defaultDueDay);
  if(Number.isInteger(current)&&current>=1&&current<=31) return current;
  // Compatibilidade: converte a configuração de data completa usada na v56 para apenas o dia.
  const legacy=String(db.settings?.defaultDueDate||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(legacy)){
    const day=Number(legacy.slice(8,10));
    if(Number.isInteger(day)&&day>=1&&day<=31) return day;
  }
  return null;
}
function defaultDueDate(referenceDate=new Date()){
  const day=configuredDueDay();
  if(day===null) return localDateKey(referenceDate);
  const year=referenceDate.getFullYear(),month=referenceDate.getMonth();
  const finalDay=new Date(year,month+1,0).getDate();
  const date=new Date(year,month,Math.min(day,finalDay));
  return localDateKey(date);
}

function enhanceResponsiveTables(root){
  (root||document).querySelectorAll('table.table').forEach(tb=>{
    const rows=[...tb.rows];
    const head=rows.find(r=>r.querySelector('th'));
    if(!head)return;
    const labels=[];[...head.cells].forEach(c=>{const t=c.textContent.replace(/[↕↑↓]/g,'').trim();for(let k=0;k<(c.colSpan||1);k++)labels.push(k?'':t);});
    tb.classList.add('rt');head.classList.add('rt-head');
    tb.style.setProperty('--readable-table-width',(labels.length>=8?1120:labels.length>=6?920:labels.length>=5?780:600)+'px');
    rows.forEach(r=>{
      if(r===head||r.dataset.rtDone)return;
      r.dataset.rtDone='1';
      let i=0;
      [...r.cells].forEach((c,ci)=>{
        const span=c.colSpan||1;
        c.setAttribute('data-label',span>1?'':(labels[i]||''));
        const onlyButtons=c.querySelector('button')&&!c.textContent.replace(/[✎\s]|Editar|Excluir|Gerar\/atualizar/g,'').trim();
        if(onlyButtons)c.classList.add('rt-btn');
        const lbl=(labels[i]||'').toLowerCase();
        if(ci===0&&/grupo|descri|m[eê]s/.test(lbl))c.classList.add('rt-wide');
        else if(/descri/.test(lbl))c.classList.add('rt-wide');
        i+=span;
      });
    });
  });
}

function relatedFutureTransactions(t){
  if(!t)return [];
  if(t.recurrenceId)return db.transactions.filter(x=>x.recurrenceId===t.recurrenceId && x.date>t.date);
  if(t.totalInstallments && t.totalInstallments>1){
    return db.transactions.filter(x=>x.description===t.description && x.accountId===t.accountId && x.categoryId===t.categoryId && x.date>=t.date && x.totalInstallments===t.totalInstallments && x.installment>=t.installment);
  }
  return [];
}
function updateFutureTransactions(t, changes){
  const related=relatedFutureTransactions(t);
  related.forEach(x=>Object.assign(x,changes));
  return related.length;
}
function deleteTransaction(id){
  const t=db.transactions.find(x=>x.id==id); if(!t)return;
  const future=relatedFutureTransactions(t);
  let mode='one';
  const recOf=t.recurrenceId?db.recurrences.find(r=>r.id===t.recurrenceId):null;
  if(future.length){
    const choice=prompt(
      `Esta movimentação possui ${future.length} lançamento(s) posterior(es).\n\n`+
      `Digite 1 para excluir somente este mês.\n`+
      `Digite 2 para excluir este e todos os posteriores${isRecurring(recOf)?' (encerra a recorrência)':''}.\n`+
      `Digite 3 para cancelar.`
    );
    if(choice==='3'||choice===null)return;
    mode=choice==='2'?'future':'one';
  }else if(!confirm('Excluir esta movimentação? Esta operação não poderá ser desfeita.'))return;
  if(mode==='future'){
    const ids=new Set([id,...future.map(x=>x.id)]);
    db.transactions=db.transactions.filter(x=>!ids.has(x.id));
    if(isRecurring(recOf)){recOf.endIdx=Math.max(0,Number(t.installment||1)-1);recOf.endedAt=localDateKey();}
  }else{
    db.transactions=db.transactions.filter(x=>x.id!=id);
    // Evita que a recorrência recrie automaticamente o mês excluído.
    if(recOf&&t.installment){recOf.skip=Array.isArray(recOf.skip)?recOf.skip:[];if(!recOf.skip.includes(Number(t.installment)))recOf.skip.push(Number(t.installment));}
  }
  save();toast(mode==='future'?'Movimentação e posteriores excluídas':'Movimentação excluída');render();
}
function editTransaction(id){
  const t=db.transactions.find(x=>x.id==id); if(!t)return;
  openTx(id);
}
function saveTransactionEdit(e,id){
  e.preventDefault();
  const t=db.transactions.find(x=>x.id==id); if(!t)return;
  const f=new FormData(e.target);

  const oldDate=String(t.date);
  const newDate=String(f.get('date'));
  const oldValue=+t.value||0;
  const newValue=parseDecimalBR(f.get('value'));
  if(!Number.isFinite(newValue)||newValue<=0)return toast('Informe um valor válido maior que zero.');
  const future=relatedFutureTransactions(t);

  const changed={
    description:String(f.get('description')??''),
    value:newValue,
    accountId:+f.get('accountId'),
    categoryId:+f.get('categoryId'),
    type:f.get('type'),
    confirmed:f.get('confirmed')==='on',
    cardId:f.get('cardId')?Number(f.get('cardId')):null,
    cardHolder:f.get('cardHolder')||'principal',
    merchant:String(f.get('merchant')||'').trim()
  };

  const newCardId=changed.cardId;
  if(newCardId && changed.type!=='despesa'){toast('Compras no cartão devem ser despesas.');return;}
  if(t.cardId!==newCardId){
    t.cardId=newCardId||undefined;
    const newCard=db.cards.find(c=>c.id===newCardId);
    t.accountId=newCardId?Number(newCard?.accountId||0):changed.accountId;
  } else if(newCardId){
    const sameCard=db.cards.find(c=>c.id===newCardId);
    t.accountId=Number(sameCard?.accountId||0);
  } else {
    t.accountId=changed.accountId;
  }
  t.cardHolder=newCardId?changed.cardHolder:'principal';
  // O estabelecimento só faz sentido em compras no cartão.
  if(newCardId&&changed.merchant)t.merchant=changed.merchant; else delete t.merchant;

  const dateChanged=newDate!==oldDate;

  // Regra de segurança: a DATA nunca é propagada silenciosamente.
  // Se ela mudar, pergunta separadamente se o restante da série deve ser deslocado.
  if(dateChanged && t.recurrenceId && future.length){
    const choice=prompt(
      `O vencimento foi alterado de ${fmtDate(oldDate)} para ${fmtDate(newDate)}.\n\n`+
      `Digite 1 para alterar somente este lançamento.\n`+
      `Digite 2 para deslocar este e TODOS os posteriores, mantendo a periodicidade.\n`+
      `Digite 3 para cancelar a alteração da data.`
    );
    if(choice==='3'||choice===null)return;

    t.date=newDate;

    if(choice==='2'){
      const installment=Number(t.installment||1);
      future.forEach(x=>{
        const offset=Number(x.installment||installment)-installment;
        x.date=addMonthsSafe(newDate,offset);
      });
      // Recorrente: os próximos meses gerados seguem o novo dia de vencimento.
      const rr=db.recurrences.find(r=>r.id===t.recurrenceId);
      if(isRecurring(rr))rr.start=addMonthsSafe(newDate,-(installment-1));
    }
  }else{
    t.date=newDate;
  }

  // Campos de conteúdo/estrutura da movimentação: pergunta individualmente
  // se a alteração deve ser propagada para os posteriores.
  const fields=[
    ['description','Descrição','string'],
    ['categoryId','Categoria','number']
  ];

  for(const [field,label,type] of fields){
    const oldVal=t[field];
    const newVal=type==='number' ? Number(changed[field]) : changed[field];
    if(String(oldVal)===String(newVal)) continue;

    let apply=false;
    if(t.recurrenceId && future.length){
      const choice=prompt(
        `${label} alterada.\n\n`+
        `Digite 1 para alterar somente este lançamento.\n`+
        `Digite 2 para aplicar a alteração a este e a todos os posteriores.\n`+
        `Digite 3 para manter ${label.toLowerCase()} somente como estava neste lançamento.`
      );
      if(choice==='3') continue;
      apply=choice==='2';
    }

    t[field]=newVal;
    if(apply) future.forEach(x=>x[field]=newVal);
    if(apply){const rr=db.recurrences.find(r=>r.id===t.recurrenceId);if(isRecurring(rr))rr[field]=newVal;}
  }

  if(t.recurrenceId && future.length && (t.cardId!==newCardId || t.cardHolder!==changed.cardHolder)){
    const choice=prompt('O cartão/titular da movimentação foi alterado.\n\nDigite 1 para alterar somente este lançamento.\nDigite 2 para aplicar a alteração a este e a todos os posteriores.');
    if(choice==='2') future.forEach(x=>{
      x.cardId=newCardId||undefined;
      const fc=db.cards.find(c=>c.id===newCardId);
      x.accountId=newCardId?Number(fc?.accountId||0):changed.accountId;
      x.cardHolder=newCardId?changed.cardHolder:'principal';
    });
  }

  // Valor segue a mesma lógica, inclusive permitindo reajuste da série.
  if(oldValue!==newValue){
    let apply=false;
    if(t.recurrenceId && future.length){
      const choice=prompt(
        `Valor alterado de ${money(oldValue)} para ${money(newValue)}.\n\n`+
        `Digite 1 para alterar somente este lançamento.\n`+
        `Digite 2 para aplicar o novo valor a este e a todos os posteriores.\n`+
        `Digite 3 para cancelar a alteração do valor.`
      );
      if(choice==='3'){
        t.value=oldValue;
      }else{
        apply=choice==='2';
        t.value=newValue;
      }
    }else{
      t.value=newValue;
    }

    if(apply){
      future.forEach(x=>x.value=newValue);
      const rec=db.recurrences.find(r=>r.id===t.recurrenceId);
      if(rec)rec.value=newValue;
    }
  }

  // Tipo e confirmação continuam sendo propriedades do lançamento editado.
  t.type=changed.type;
  t.confirmed=changed.confirmed;

  save();closeModal();
  toast('Movimentação alterada');
  render();
}

  for(let i=0;i<count;i++){
    if(pos+46>bytes.length||view.getUint32(pos,true)!==0x02014b50)throw new Error('Índice do ZIP inválido.');
    const method=view.getUint16(pos+10,true),crc=view.getUint32(pos+16,true),compressed=view.getUint32(pos+20,true),size=view.getUint32(pos+24,true),nameLen=view.getUint16(pos+28,true),extraLen=view.getUint16(pos+30,true),commentLen=view.getUint16(pos+32,true),localOffset=view.getUint32(pos+42,true);
    const name=decoder.decode(bytes.subarray(pos+46,pos+46+nameLen));pos+=46+nameLen+extraLen+commentLen;
    if(localOffset+30>bytes.length||view.getUint32(localOffset,true)!==0x04034b50)throw new Error('Arquivo interno inválido no ZIP: '+name);

    if(method===8){

      throw new Error('O ZIP usa compactação incompatível. Gere o backup pelo botão do Ricas Finanças.');
    }
    if(method!==0)throw new Error('Método de compactação não suportado no arquivo '+name+'.');
    if(data.length!==size||zipCRC32(data)!==crc)throw new Error('Falha na integridade do arquivo interno '+name+'.');

}
function validateBackupJSON(x){
  if(!x||typeof x!=='object'||Array.isArray(x)||!Array.isArray(x.accounts)||!Array.isArray(x.categories)||!Array.isArray(x.transactions))throw new Error('O JSON não contém uma base Ricas Finanças válida.');
  for(const key of ['plans','transfers','cards','sms','recurrences'])if(x[key]!==undefined&&!Array.isArray(x[key]))throw new Error('Estrutura inválida no campo '+key+'.');
  if(x.settings!==undefined&&(!x.settings||typeof x.settings!=='object'||Array.isArray(x.settings)))throw new Error('Configurações inválidas no backup.');
  return true;
}
async function saveFullBackupZIPToUserLocation(blob,filename){
  if(!window.showDirectoryPicker&&!window.showSaveFilePicker){
    const r=await deliverFile(blob,filename);
    if(r==='cancel'){const e=new Error('cancelado');e.name='AbortError';throw e;}
    return r==='share'?'file':'download';
  }
  // Preferir a escolha explícita de diretório; o arquivo é gravado dentro dele.
  if(window.showDirectoryPicker){
    const dir=await window.showDirectoryPicker({mode:'readwrite'});
    let permission=await dir.queryPermission({mode:'readwrite'});
    if(permission!=='granted')permission=await dir.requestPermission({mode:'readwrite'});
    if(permission!=='granted')throw new Error('Permissão de gravação na pasta não concedida.');
    const handle=await dir.getFileHandle(filename,{create:true});
    const writable=await handle.createWritable();
    await writable.write(blob);
    await writable.close();
    return 'directory';
  }
  // Em navegadores sem seletor de diretório, pedir ao usuário o destino do arquivo.
  if(window.showSaveFilePicker){
    const handle=await window.showSaveFilePicker({
      suggestedName:filename,
      types:[{description:'Backup completo Ricas Finanças (ZIP)',accept:{'application/zip':['.zip']}}]
    });
    const writable=await handle.createWritable();
    await writable.write(blob);
    await writable.close();
    return 'file';
  }
  // Compatibilidade com navegadores que não oferecem a File System Access API.
  downloadBlob(blob,filename);
  return 'download';
}
async function exportFullBackupZIP(){
  if(!storageConnected()){toast('Conecte o banco SQLite antes de gerar o backup completo. Nenhum backup parcial foi criado.');return;}
  try{
    if(!await persistSQLite())throw new Error('Não foi possível sincronizar o banco antes do backup.');
    const sqliteBytes=sqliteDb.export(),jsonText=JSON.stringify(db,null,2),stamp=new Date().toISOString();
    const safeStamp=stamp.replace(/[:.]/g,'-').replace('Z','');
    const filename='ricas-financas-backup-completo-'+safeStamp+'.zip';
    const manifest={application:'Ricas Finanças',formatVersion:1,appVersion:'v93',createdAt:stamp,files:['backup.json','ricas-financas.sqlite'],databaseIncluded:true,jsonIncluded:true,compression:'ZIP Store (sem compactação adicional)'};
    const zip=createStoreZIP([
      {name:'backup.json',data:new TextEncoder().encode(jsonText)},
      {name:SQLITE_FILE,data:sqliteBytes},
      {name:'manifest.json',data:JSON.stringify(manifest,null,2)}
    ]);
    const result=await saveFullBackupZIPToUserLocation(new Blob([zip],{type:'application/zip'}),filename);
    if(result==='directory')toast('Backup completo salvo na pasta escolhida.');
    else if(result==='file')toast('Backup completo salvo no local escolhido.');
    else toast('Backup completo preparado. O navegador usou o mecanismo padrão de download.');
  }catch(e){
    if(e?.name==='AbortError')return;
    console.error('Backup completo:',e);toast('Não foi possível salvar o backup: '+(e?.message||e));
  }
}
async function restoreFullBackupZIP(inp){
  const file=inp.files?.[0];if(!file)return;
  try{
    if(!SQL)throw new Error('A biblioteca SQLite ainda não carregou. Recarregue o aplicativo e tente novamente.');
    if(!storageConnected())throw new Error('Antes de restaurar, conecte o banco SQLite de destino. Se necessário, crie uma base nova e vazia.');
    const zipBytes=new Uint8Array(await file.arrayBuffer()),files=readStoreZIP(zipBytes);
    if(!files['backup.json']||!files[SQLITE_FILE]||!files['manifest.json'])throw new Error('O ZIP não contém todos os arquivos obrigatórios (JSON, SQLite e manifesto).');
    const imported=JSON.parse(new TextDecoder().decode(files['backup.json']));validateBackupJSON(imported);
    const manifest=JSON.parse(new TextDecoder().decode(files['manifest.json']));
    if(manifest.application!=='Ricas Finanças'||manifest.databaseIncluded!==true)throw new Error('O manifesto não identifica um backup completo do Ricas Finanças.');
    const checkDb=new SQL.Database(files[SQLITE_FILE]);
    try{
      const check=checkDb.exec("SELECT key,data FROM app_state WHERE key IN ('accounts','categories','transactions','settings')");
      if(!check.length)throw new Error('O SQLite interno não contém os dados esperados do aplicativo.');
      const found=Object.fromEntries(check[0].values.map(row=>[row[0],JSON.parse(row[1])]));
      if(!Array.isArray(found.accounts)||!Array.isArray(found.categories)||!Array.isArray(found.transactions)||!found.settings)throw new Error('O SQLite interno está incompleto.');
      for(const key of ['accounts','categories','transactions'])if(JSON.stringify(found[key])!==JSON.stringify(imported[key]))throw new Error('O JSON e o SQLite do backup divergem no campo '+key+'. O backup não foi restaurado.');
    }finally{checkDb.close();}
    const confirmed=confirm('RESTAURAÇÃO COMPLETA DO BACKUP\n\nArquivo: '+file.name+'\nData do backup: '+(manifest.createdAt||'não informada')+'\n\nA restauração substituirá os dados do aplicativo e o conteúdo do banco SQLite atualmente conectado.\n\nConfirme apenas se este é o banco de destino correto e se deseja substituir os dados atuais.');
    if(!confirmed)return;
    const oldDb=db,oldSqliteDb=sqliteDb,oldReady=dbReady,oldMode=dbStorageMode;
    try{
      let restoredState=Object.assign({},base,imported);
      restoredState.recurrences=restoredState.recurrences||[];restoredState.accounts=(restoredState.accounts||[]).map(a=>({...a,showInSummary:a.showInSummary!==false}));
      db=restoredState;sqliteDb=new SQL.Database(files[SQLITE_FILE]);createSQLiteDatabase();normalizeCardData();normalizeOrders();normalizeTransfers();
      writeStateToSQLite();
      const finalBytes=sqliteDb.export();
      await writeSQLiteBytes(finalBytes);
      dbReady=true;
    }catch(e){db=oldDb;sqliteDb=oldSqliteDb;dbReady=oldReady;dbStorageMode=oldMode;throw new Error('Falha ao gravar o banco restaurado. A sessão anterior foi mantida. Detalhe: '+(e?.message||e));}
    toast('Backup completo restaurado com sucesso.');render();
  }catch(e){console.error('Restauração ZIP:',e);toast('Restauração não concluída: '+(e?.message||e));}
  finally{inp.value='';}
}
function importJSON(inp){
  const file=inp.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const imported=JSON.parse(reader.result);validateBackupJSON(imported);
      if(!confirm('RESTAURAR BACKUP JSON\n\nOs dados atuais serão substituídos. Este arquivo contém apenas JSON e não garante a recuperação do arquivo SQLite original. Deseja continuar?'))return;
      const previous=db,previousSqlite=sqliteDb;
      if(!storageConnected())throw new Error('Conecte o banco SQLite antes de restaurar, para que os dados sejam gravados com segurança.');
      db=Object.assign({},base,imported);db.recurrences=db.recurrences||[];db.accounts=(db.accounts||[]).map(a=>({...a,showInSummary:a.showInSummary!==false}));normalizeOrders();normalizeCardData();normalizeTransfers();
      if(!await persistSQLite()){db=previous;sqliteDb=previousSqlite;throw new Error('Não foi possível gravar o SQLite; a sessão anterior foi mantida.');}
      toast('Backup JSON restaurado.');render();
    }catch(e){console.error('Restauração JSON:',e);toast('Arquivo inválido ou restauração não concluída: '+(e?.message||e));}
    finally{inp.value='';}
  };
  reader.readAsText(file);
}
