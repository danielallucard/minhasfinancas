<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--primary:#246bfe;--green:#159447;--red:#d92d20;--amber:#d98c00;--border:#e6e9ef;--shadow:0 8px 24px #17202a12}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#17202a;color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:20}.brand{font-weight:800;font-size:20px;padding:8px 12px 20px}.nav button{width:100%;border:0;background:transparent;color:#dbe4ee;text-align:left;padding:12px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff16;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:92px 22px 22px}.top{position:fixed;top:0;left:250px;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0;padding:14px 22px;background:var(--bg);box-shadow:0 3px 12px rgba(0,0,0,.08);min-height:70px}.top>div:first-child{flex:1;text-align:center}.top h1{margin:0;font-size:25px;display:inline-flex;align-items:center;justify-content:center;gap:9px}.top h1 .page-icon{font-size:1em;line-height:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 13px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--red)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:25px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--primary)}.muted{color:var(--muted)}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3ff;color:#3159bb;font-size:12px}.empty{text-align:center;padding:35px;color:var(--muted)}.form{display:grid;gap:11px}.form label{font-size:12px;color:var(--muted);display:grid;gap:5px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;background:#fff}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.modal.show{display:flex}.modalbox{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:15px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{margin:0}.close{border:0;background:transparent;font-size:22px}.chart{height:230px;display:flex;align-items:end;gap:8px;padding:15px 5px 0}.bar{flex:1;background:#246bfe88;border-radius:5px 5px 0 0;min-width:12px;position:relative}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.progress{height:10px;background:#edf0f4;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary)}.mobilebar{display:none}.order-buttons{display:inline-flex;gap:4px;margin-left:6px}.order-buttons .btn{padding:4px 8px;min-width:30px}
.pending-row{opacity:.82}.account-card{margin-bottom:16px}.confirm-cell{white-space:nowrap;text-align:center}.confirm-check{width:20px;height:20px;cursor:pointer;accent-color:var(--primary)}.edit-btn{margin-right:5px}.cat-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
.mobile-menu-btn,.mobile-drawer,.mobile-overlay{display:none}
@media(max-width:1180px){
  .mobile-menu-btn{display:block;position:fixed;top:10px;left:10px;z-index:80;border:0;background:#17202a;color:#fff;border-radius:9px;padding:9px 11px;font-size:20px;box-shadow:0 2px 8px #0002}
  .mobile-drawer{position:fixed;display:block;top:0;bottom:0;left:-290px;width:270px;background:#17202a;color:#fff;z-index:90;padding:16px;transition:left .2s ease;box-shadow:4px 0 20px #0003;overflow:auto}

  .mobile-drawer button.nav-mobile-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dbe4ee;padding:13px 10px;border-radius:9px;margin:2px 0}
  .mobile-drawer button.nav-mobile-item.active{background:#ffffff18;color:#fff}
  .mobile-overlay{position:fixed;inset:0;background:#0006;z-index:85}
  .mobile-overlay.open{display:block}

}
.month-nav{position:sticky;top:70px;z-index:35;display:flex;align-items:center;justify-content:center;gap:6px;margin:-4px 0 14px;padding:8px 0;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.05)}.month-nav .btn{min-width:52px}.month-current{min-width:170px;text-transform:capitalize;font-weight:700}
.toast{position:fixed;right:18px;bottom:18px;background:#17202a;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:1180px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:112px 12px 80px}.top{left:0;right:0;margin:0;padding:11px 12px;min-height:78px}.month-nav{top:78px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#17202a;z-index:30;justify-content:space-around;padding:7px}.mobilebar button{background:none;border:0;color:#fff;font-size:11px}.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g4,.g3,.g2,.row{grid-template-columns:1fr}.top{align-items:center;flex-direction:column;min-height:96px}.top>div:first-child{width:100%;text-align:center}.month-nav{top:96px}.main{padding-top:130px}.metric .value{font-size:21px}}

.category-icon{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;margin-right:5px;font-size:1.08em;vertical-align:middle}.category-picker{position:relative;min-width:0}.category-options{position:absolute;z-index:1000;left:0;right:0;top:100%;max-height:240px;overflow:auto;background:var(--card,#fff);border:1px solid var(--border,#d9dee7);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:4px}.category-option{width:100%;border:0;background:transparent;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;gap:8px;cursor:pointer;border-radius:7px}.category-option:hover{background:rgba(36,107,254,.08)}
</style>

<style>
.overdue-card{border-left:4px solid #dc2626}
.overdue-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.overdue-total{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;font-size:16px}
</style>

<style id="tx-sort-style">
.sortable-header .sort-th{
  appearance:none;border:0;background:transparent;font:inherit;font-weight:700;
  cursor:pointer;padding:4px 2px;display:inline-flex;align-items:center;gap:5px;
  color:inherit;white-space:nowrap;
}
.sortable-header .sort-th:hover{text-decoration:underline}
.sortable-header .sort-th span{font-size:.82em;opacity:.65}
</style>
<style id="account-collapse-style">
.account-transactions{margin-top:14px;border-top:1px solid #e5e7eb;padding-top:10px}
.account-transactions summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;user-select:none}
.account-transactions summary::-webkit-details-marker{display:none}
.account-transactions summary::before{content:'▶';font-size:.75em;opacity:.65;transition:transform .15s ease}
.account-transactions[open] summary::before{transform:rotate(90deg)}
.account-transactions summary:hover{text-decoration:underline}
</style>
<style id="summary-pie-style">
.summary-pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:14px}
.summary-pie{width:min(360px,100%);aspect-ratio:1/1;max-width:360px;flex:0 1 360px}
.summary-pie svg{width:100%;height:100%;display:block}
.summary-pie path{cursor:pointer;stroke:#fff;stroke-width:1.5;transition:opacity .15s,transform .15s}
.summary-pie path:hover{opacity:.82}
.summary-pie-legend{flex:1;min-width:220px;max-height:360px;overflow:auto}
.summary-pie-legend-item{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;cursor:pointer}
.summary-pie-legend-item:hover,.summary-pie-legend-item.active{background:#f1f5f9}
.summary-pie-dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.summary-pie-empty{padding:28px;text-align:center;color:var(--muted)}
</style>
<style id="summary-mobile-responsive-style">
.summary-page{width:100%;max-width:100%;min-width:0;overflow-x:clip}
.summary-page .grid,.summary-page .card{min-width:0;max-width:100%}
.summary-page .month-nav{position:sticky;top:70px;z-index:39}
.summary-page .grid>*{min-width:0}
.summary-page .table-wrap{width:100%;max-width:100%;overflow-x:auto}
.summary-page .summary-pie-wrap{width:100%;max-width:100%}
@media(max-width:1180px){
  .summary-page .month-nav{top:78px}
}
@media(max-width:560px){
  .summary-page{width:100%;margin:0 auto}
  .summary-page .card{width:100%;padding:13px}
  .summary-page .summary-pie-wrap{flex-direction:column;align-items:stretch;gap:12px}
  .summary-page .summary-pie{width:min(100%,300px);max-width:300px;margin:0 auto;flex:0 0 auto}
  .summary-page .summary-pie-legend{width:100%;min-width:0;max-width:100%;max-height:none;overflow:visible}
  .summary-page .summary-pie-legend-item{min-width:0}
  .summary-page .summary-pie-legend-item span:nth-child(2){min-width:0;overflow-wrap:anywhere}
  .summary-page .metric .value{overflow-wrap:anywhere}
  .summary-page .month-nav{width:100%;max-width:100%;padding-left:0;padding-right:0;top:96px}
}
</style>
<style id="budget-style">
.budget-table input.budget-pct{width:80px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:right}
.budget-table td,.budget-table th{vertical-align:middle}
.budget-bar{height:10px;background:#edf0f4;border-radius:99px;overflow:hidden;min-width:120px}
.budget-bar>i{display:block;height:100%}
.budget-total-ok{color:var(--green);font-weight:700}
.budget-total-bad{color:var(--red);font-weight:700}
.budget-group-head{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--border);font-weight:700}
.budget-group-head .muted{font-weight:400;font-size:12px}
.budget-cat-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0}
.budget-cat-row select{border:1px solid var(--border);border-radius:8px;padding:6px;background:#fff;max-width:240px}
.budget-income{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0 14px}
.budget-income label{font-size:12px;color:var(--muted);display:grid;gap:5px;min-width:200px}
.budget-income select,.budget-income input{border:1px solid var(--border);border-radius:8px;padding:9px;background:#fff}
</style>
<style id="budget-report-style">
.bgr-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.bgr-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.bgr-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border)}
.bgr-row:last-child{border-bottom:0}
.bgr-track{position:relative;height:30px}
.bgr-bar{position:absolute;left:0;height:12px;border-radius:0 6px 6px 0}
.bgr-bar.planned{top:0;opacity:.35}
.bgr-bar.real{top:14px}
.bgr-bar.commit{top:14px;opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 4px,#fff8 4px 8px)}
.bgr-vals{font-size:11px;color:var(--muted);margin-top:2px}
.bgr-month{display:flex;gap:16px;align-items:flex-end;overflow-x:auto;padding:4px 4px 0;position:relative}
.bgr-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px}
.bgr-col-bars{display:flex;align-items:flex-end;gap:3px;height:200px;position:relative;border-bottom:1px solid var(--border)}
.bgr-col-bars>div{width:11px;border-radius:3px 3px 0 0}
.bgr-ref{position:absolute;left:-4px;right:-4px;border-top:2px dashed var(--red);opacity:.6}
@media(max-width:560px){.bgr-row{grid-template-columns:1fr}}
</style>
<style id="ios-style">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.summary-page{overflow-x:hidden}
@supports(overflow:clip){.summary-page{overflow-x:clip}}
.table-wrap,.mobile-drawer,.modalbox,.category-options,.bgr-month{-webkit-overflow-scrolling:touch}
.sidebar{padding-top:calc(18px + env(safe-area-inset-top))}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.modal{padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.modalbox{max-height:calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
@supports(height:100dvh){.modalbox{max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}}
.toast{bottom:calc(18px + env(safe-area-inset-bottom))}
@media(max-width:1180px){
  input,select,textarea{font-size:16px!important}
  .btn,.mobilebar button,.nav-mobile-item{min-height:40px}
  .top{padding-top:calc(11px + env(safe-area-inset-top));padding-left:calc(56px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));min-height:calc(78px + env(safe-area-inset-top))}
  .mobile-menu-btn{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}
  .mobile-drawer{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .main{padding-top:calc(112px + env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  .month-nav,.summary-page .month-nav{top:calc(78px + env(safe-area-inset-top))}
  .mobilebar{padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center}
}
@media(max-width:560px){
  .top{min-height:calc(96px + env(safe-area-inset-top))}
  .month-nav,.summary-page .month-nav{top:calc(96px + env(safe-area-inset-top))}
  .main{padding-top:calc(130px + env(safe-area-inset-top))}
}
</style>
<style id="responsive-style">
/* ===== Layout responsivo (mobile-first, inspirado no Bootstrap) =====
   --toph é a altura real do cabeçalho, medida por JavaScript, para posicionar conteúdo e navegação de mês. */
:root{--toph:70px;--bnav:62px}
@media(max-width:1180px){
  .mobile-menu-btn{display:none!important}
  .top{left:0;right:0;flex-direction:column;align-items:stretch;gap:8px;min-height:0!important;
       padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left))!important}
  .top>div:first-child{text-align:center}
  .top h1{font-size:19px}
  #subtitle:empty{display:none}
  .top .actions{flex-wrap:nowrap;overflow-x:auto;justify-content:center;gap:6px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .top .actions::-webkit-scrollbar{display:none}
  .top .actions:empty{display:none}
  .top .actions .btn{flex:0 0 auto;white-space:nowrap;padding:8px 12px}
  .main{margin-left:0;width:100%;
        padding:calc(var(--toph) + 10px) calc(10px + env(safe-area-inset-right)) calc(var(--bnav) + 18px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))!important}
  .month-nav,.summary-page .month-nav{top:var(--toph)!important;margin:-10px -10px 12px;padding:8px 10px;gap:6px}
  .month-nav .btn{min-width:44px;flex:0 0 auto}
  .month-current{flex:1 1 auto;min-width:0!important}
  /* Barra inferior estilo app */
  .mobilebar{display:flex;height:auto;min-height:var(--bnav);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:2px;box-shadow:0 -4px 14px #0002}
  .mobilebar button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:10.5px;color:#cbd5e1;min-width:0}
  .mobilebar button .mb-ico{font-size:20px;line-height:1}
  .mobilebar button .mb-lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobilebar button.active{background:#ffffff1a;color:#fff;font-weight:700}
  .toast{bottom:calc(var(--bnav) + 12px + env(safe-area-inset-bottom))!important}
  /* Cards, grades e tipografia */
  .grid{gap:10px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:13px;border-radius:12px}
  .section{margin-top:12px}
  .section h2,.card h2{font-size:16px}
  .metric .value,.value{font-size:19px!important;overflow-wrap:anywhere}
  .metric .label{font-size:12px}
  .muted{overflow-wrap:anywhere}
  /* Formulários */
  .form label,.budget-income label{min-width:0!important}
  #content label[style*="min-width:220px"]{min-width:0!important;flex:1 1 100%!important}
  .form .btn.primary,form>.btn.primary{width:100%;padding:12px}
  .actions .btn,.row>.btn{flex:1 1 auto}
  .budget-income{flex-direction:column;align-items:stretch}
  .budget-cat-row{border-bottom:1px solid var(--border)}
  .budget-cat-row select{flex:1 1 100%;max-width:none}
  .budget-cat-row .btn{padding:6px 10px}
  /* Modal como "bottom sheet" */
  .modal{align-items:flex-end;padding:0!important}
  .modalbox{width:100%;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
            max-height:92vh;animation:sheetUp .2s ease-out}
  @supports(height:100dvh){.modalbox{max-height:92dvh}}
  .modalhead{position:sticky;top:-14px;background:#fff;z-index:2;margin:-14px -14px 12px;padding:14px;border-bottom:1px solid var(--border)}
  .modalhead::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:9px;background:#d1d5db}
  .account-card>div:first-child{flex-wrap:wrap}
  .account-card>div:first-child>div:last-child{text-align:left!important}
  .overdue-head{flex-wrap:wrap}
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(max-width:560px){
  .g2,.row{grid-template-columns:1fr}
  .summary-page .summary-pie{max-width:260px}
}
@media(max-width:380px){
  .g4,.g3{grid-template-columns:1fr}
}
/* ===== Tabelas viram cartões em telas pequenas ===== */
@media(max-width:1180px){
  .table-wrap{overflow:visible}
  table.table.rt,table.table.rt tbody{display:block;width:100%}
  table.table.rt tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:11px 12px;margin:0 0 10px;
                    border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 8px #17202a0d}
  table.table.rt tr.rt-head{display:none}
  table.table.rt tr.rt-head.sortable-header{display:flex;flex-wrap:wrap;gap:6px;padding:0;border:0;box-shadow:none;background:transparent}
  table.table.rt tr.rt-head.sortable-header th{padding:0;border:0}
  table.table.rt tr.rt-head.sortable-header th:not(:has(button)){display:none}
  table.table.rt tr.rt-head.sortable-header .sort-th{border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:#fff;font-size:12px;text-transform:none}
  table.table.rt td{display:block;padding:0;border:0;white-space:normal;min-width:0;overflow-wrap:anywhere;font-size:14px}

<script>

// Valores decimais: o campo textual permite digitar vírgula no teclado do iOS/Android.
// Não altera o texto durante a digitação; valida antes de salvar e armazena como Number.
function parseDecimalBR(raw){
  if(typeof raw==='number')return Number.isFinite(raw)?raw:NaN;
  let v=String(raw??'').trim().replace(/^R\$\s*/i,'').replace(/[\s\u00a0\u202f]/g,'');
  if(!v)return NaN;
  if(v.includes(',')){
    if(!/^[+-]?(?:\d+|\d{1,3}(?:\.\d{3})+),\d{0,2}$/.test(v))return NaN;
    v=v.replace(/\./g,'').replace(',','.');
  }else if(/^[+-]?\d{1,3}(?:\.\d{3})+$/.test(v))v=v.replace(/\./g,'');
  else if(!/^[+-]?(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(v))return NaN;
  const n=Number(v);return Number.isFinite(n)?n:NaN;
}
function decimalInputValue(value){
  if(value==null||value==='')return '';
  const n=typeof value==='number'?value:parseDecimalBR(value);
  return Number.isFinite(n)?n.toLocaleString('pt-BR',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:2}):'';
}
function validateDecimalField(el){
  el.setCustomValidity('');
  if(!el.value.trim())return !el.required;
  const n=parseDecimalBR(el.value);
  let msg='';
  if(!Number.isFinite(n))msg='Informe um valor válido, como 123,45 ou 1.234,56.';
  else if(el.dataset.min!==undefined&&n<Number(el.dataset.min))msg='O valor mínimo é '+decimalInputValue(Number(el.dataset.min))+'.';
  else if(el.dataset.max!==undefined&&n>Number(el.dataset.max))msg='O valor máximo é '+decimalInputValue(Number(el.dataset.max))+'.';
  el.setCustomValidity(msg);return !msg;
}
document.addEventListener('input',e=>{if(e.target.matches?.('[data-decimal]'))e.target.setCustomValidity('');});
document.addEventListener('focusout',e=>{
  const el=e.target;if(!el.matches?.('[data-decimal]')||!el.value.trim())return;
  if(validateDecimalField(el))el.value=decimalInputValue(parseDecimalBR(el.value));
});
document.addEventListener('submit',e=>{
  for(const el of e.target.querySelectorAll('[data-decimal]')){
    if(el.disabled)continue;
    if(!validateDecimalField(el)){
      e.preventDefault();e.stopImmediatePropagation();el.reportValidity();return;
    }
  }
},true);

const DB_FILE='ricas-financas-db.json';
const KEY='ricas_financas_web_v1';
const base={recurrences:[],accounts:[],categories:[
{id:1,name:'Alimentação',type:'despesa',color:'#f59e0b'},{id:2,name:'Moradia',type:'despesa',color:'#ef4444'},
{id:3,name:'Transporte',type:'despesa',color:'#3b82f6'},{id:4,name:'Salário',type:'receita',color:'#22c55e'}
],transactions:[],plans:[],goals:[],transfers:[],cards:[],sms:[],settings:{currency:'BRL'}};
// Divisão do orçamento por grupos (referência: método de Raul Sena / Investidor Sardinha).
// Os percentuais são aplicados sobre a receita mensal e podem ser alterados pelo usuário.
const BUDGET_GROUPS_DEFAULT=[
  {key:'custos_fixos',name:'Custos fixos',percent:30,color:'#ef4444',icon:'🏠',hint:'Despesas difíceis de cortar no curto prazo (moradia, contas de consumo, financiamentos, plano de saúde, mercado).'},
  {key:'conforto',name:'Conforto',percent:15,color:'#f59e0b',icon:'🛋️',hint:'Gastos que facilitam a rotina e podem ser cancelados a qualquer momento (streaming, diarista, aplicativos).'},
  {key:'metas',name:'Metas',percent:15,color:'#8b5cf6',icon:'🎯',hint:'Objetivos de curto e médio prazo (viagem, troca de carro, reforma).'},
  {key:'prazeres',name:'Prazeres',percent:10,color:'#ec4899',icon:'🎉',hint:'Lazer, restaurantes, hobbies e presentes.'},
  {key:'investimentos',name:'Investimentos',percent:25,color:'#22c55e',icon:'📈',hint:'Liberdade financeira: aportes para construção de patrimônio.'},
  {key:'conhecimento',name:'Conhecimento',percent:5,color:'#3b82f6',icon:'📚',hint:'Cursos, livros, idiomas e capacitação.'}
];
function budgetGroupDef(key){return BUDGET_GROUPS_DEFAULT.find(g=>g.key===key)||null;}
function normalizeBudget(){
  if(!db.settings||typeof db.settings!=='object') db.settings={};
  const b=(db.settings.budget&&typeof db.settings.budget==='object')?db.settings.budget:{};
  const saved=Array.isArray(b.groups)?b.groups:[];
  b.groups=BUDGET_GROUPS_DEFAULT.map(g=>{
    const x=saved.find(y=>y&&y.key===g.key);
    const p=Number(x?.percent);
    return {key:g.key,percent:Number.isFinite(p)&&p>=0?p:g.percent};
  });
  if(!['expected','confirmed','manual'].includes(b.incomeMode)) b.incomeMode='expected';
  b.manualIncome=Number(b.manualIncome)||0;
  db.settings.budget=b;
  (db.categories||[]).forEach(c=>{
    if(c.type!=='despesa'){ if('budgetGroup' in c) delete c.budgetGroup; return; }
    if(c.budgetGroup && !budgetGroupDef(c.budgetGroup)) c.budgetGroup='';
  });
}

function normalizeTransfers(){
  if(!Array.isArray(db.transfers)) db.transfers=[];
  if(!Array.isArray(db.transactions)) db.transactions=[];
  db.transfers.forEach((tr,i)=>{
    if(tr.order===undefined||tr.order===null) tr.order=i;
    // Vincula transferências antigas aos dois lançamentos correspondentes.
    let fromTx=tr.fromTxId?db.transactions.find(x=>x.id==tr.fromTxId):null;
    let toTx=tr.toTxId?db.transactions.find(x=>x.id==tr.toTxId):null;
    if(!fromTx) fromTx=db.transactions.find(x=>x.transfer && !x.transferId && x.accountId==tr.from && x.type==='despesa' && String(x.date)===String(tr.date) && Number(x.value)===Number(tr.value));
    if(!toTx) toTx=db.transactions.find(x=>x.transfer && !x.transferId && x.accountId==tr.to && x.type==='receita' && String(x.date)===String(tr.date) && Number(x.value)===Number(tr.value));
    if(fromTx){ fromTx.transfer=true; fromTx.transferId=tr.id; fromTx.confirmed=true; tr.fromTxId=fromTx.id; }
    if(toTx){ toTx.transfer=true; toTx.transferId=tr.id; toTx.confirmed=true; tr.toTxId=toTx.id; }
    // Repara transferências antigas que tenham o registro principal, mas um dos lançamentos tenha sido perdido.
    if(!fromTx && db.accounts.some(a=>a.id==tr.from)){
      fromTx={id:uid(),date:tr.date,description:'Transferência enviada',value:Number(tr.value)||0,accountId:tr.from,categoryId:0,type:'despesa',transfer:true,transferId:tr.id,confirmed:true};
      db.transactions.push(fromTx); tr.fromTxId=fromTx.id;
    }
    if(!toTx && db.accounts.some(a=>a.id==tr.to)){
      toTx={id:uid(),date:tr.date,description:'Transferência recebida',value:Number(tr.value)||0,accountId:tr.to,categoryId:0,type:'receita',transfer:true,transferId:tr.id,confirmed:true};
      db.transactions.push(toTx); tr.toTxId=toTx.id;
    }
  });
}

function normalizeOrders(){
  // Mantém a ordem dos cadastros estável e compatível com versões anteriores.
  const collections=['accounts','categories','cards','plans','goals','transfers','recurrences'];
  for(const key of collections){
    if(!Array.isArray(db[key])) db[key]=[];
    db[key].forEach((item,i)=>{
      if(item && (item.order===undefined || item.order===null || Number.isNaN(Number(item.order)))){
        item.order=i;
      }
    });
    db[key].sort((a,b)=>(Number(a?.order??0)-Number(b?.order??0)));
  }
  if(Array.isArray(db.categories)) db.categories.forEach(c=>{if(!c.icon)c.icon=defaultCategoryIcon(c.name);});
  if(!Array.isArray(db.transactions)) db.transactions=[];
  if(!Array.isArray(db.sms)) db.sms=[];
  if(!db.settings || typeof db.settings!=='object') db.settings={};
  normalizeBudget();
  normalizeGoals();
}
// Metas de alocação: objetivos concretos (viagem, equipamento) com aportes registrados ao longo do tempo.
// Não confundir com a divisão do orçamento: aqui o dinheiro é guardado para um objetivo específico.
function normalizeGoals(){
  if(!Array.isArray(db.goals)) db.goals=[];
  db.goals.forEach((g,i)=>{
    if(!g) return;
    g.name=String(g.name||'').trim();
    g.icon=g.icon||'🎯';
    g.color=g.color||'#8b5cf6';
    g.target=Number(g.target)||0;
    g.deadline=String(g.deadline||'');
    g.note=String(g.note||'');
    g.done=g.done===true;
    if(g.order===undefined||g.order===null) g.order=i;
    if(!Array.isArray(g.deposits)) g.deposits=[];
    g.deposits.forEach(d=>{d.value=Number(d.value)||0;d.date=String(d.date||'');d.note=String(d.note||'');});
  });
}

let db=JSON.parse(JSON.stringify(base)); normalizeCardData(); normalizeTransfers();
let page='dashboard';
let selectedMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const navItems=[['dashboard','🏠','Resumo'],['transactions','↔️','Movimentações'],['recurrences','🔁','Automatizações'],['accounts','🏦','Contas'],['categories','🏷️','Categorias'],['goals','🎯','Metas'],['transfers','⇄','Transferências'],['cards','💳','Cartões'],['reports','📊','Relatórios'],['settings','⚙️','Configurações']];
let dbReady=false;
let dbDirHandle=null;
let sqliteFileHandle=null;
let sqliteDb=null;
let SQL=null;
let dbStorageMode='disconnected';
const SQLITE_FILE='ricas-financas.sqlite';
const SQLITE_TABLES=['accounts','categories','transactions','plans','goals','transfers','cards','sms','recurrences','settings'];
const DB_HANDLE_KEY='ricas_financas_sqlite_handle';

function sqliteStateRows(){
  return SQLITE_TABLES.map(key=>({key,data:JSON.stringify(db[key]??(key==='settings'?{}:[]))}));
}
function createSQLiteDatabase(){
  sqliteDb.run('CREATE TABLE IF NOT EXISTS app_state (key TEXT PRIMARY KEY, data TEXT NOT NULL)');
  sqliteDb.run('CREATE TABLE IF NOT EXISTS metadata (key TEXT PRIMARY KEY, value TEXT NOT NULL)');
}
function writeStateToSQLite(){
  if(!sqliteDb) throw new Error('SQLite não conectado');
  sqliteDb.run('BEGIN');
  try{
    sqliteDb.run('DELETE FROM app_state');
    const stmt=sqliteDb.prepare('INSERT INTO app_state(key,data) VALUES (?,?)');
    for(const row of sqliteStateRows()) stmt.run([row.key,row.data]);
    stmt.free();
    sqliteDb.run("INSERT OR REPLACE INTO metadata(key,value) VALUES ('schema_version','1')");
    sqliteDb.run("INSERT OR REPLACE INTO metadata(key,value) VALUES ('app','Ricas Finanças')");
    sqliteDb.run("INSERT OR REPLACE INTO metadata(key,value) VALUES ('updated_at',datetime('now'))");
    sqliteDb.run('COMMIT');
  }catch(e){
    try{sqliteDb.run('ROLLBACK')}catch(_){}
    throw e;
  }
}
function readStateFromSQLite(){
  const result=sqliteDb.exec('SELECT key,data FROM app_state');
  if(!result.length)return false;
  for(const [key,data] of result[0].values){
    try{
      const value=JSON.parse(data);
      if(key==='settings')db.settings=value||{};
      else if(Array.isArray(value))db[key]=value;
    }catch(e){console.warn('Registro SQLite inválido:',key,e)}
  }
  db.recurrences=db.recurrences||[];
  db.accounts=(db.accounts||[]).map(a=>({...a,showInSummary:a.showInSummary!==false}));
  normalizeCardData();
  if(typeof normalizeOrders==='function') normalizeOrders();
  normalizeTransfers();
  return true;
}
// ===== Armazenamento local para iOS (Safari/WebKit não possui File System Access API) =====
const LOCAL_IDB='ricas_financas_local', LOCAL_STORE='files', LOCAL_KEY='sqlite';
function hasFsApi(){return !!(window.showDirectoryPicker||window.showOpenFilePicker);}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){return window.navigator.standalone===true||window.matchMedia?.('(display-mode: standalone)').matches;}
function localIdb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(LOCAL_IDB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(LOCAL_STORE);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function localDbGet(){
  try{const d=await localIdb();return await new Promise(res=>{const q=d.transaction(LOCAL_STORE,'readonly').objectStore(LOCAL_STORE).get(LOCAL_KEY);q.onsuccess=()=>res(q.result?new Uint8Array(q.result):null);q.onerror=()=>res(null);});}
  catch(e){return null;}
}
async function localDbPut(bytes){
  const d=await localIdb();
  const buf=bytes.slice().buffer;
  await new Promise((res,rej)=>{const tx=d.transaction(LOCAL_STORE,'readwrite');tx.objectStore(LOCAL_STORE).put(buf,LOCAL_KEY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});
}
function storageConnected(){return !!(dbReady&&sqliteDb&&(dbStorageMode==='local'||sqliteFileHandle));}
async function writeSQLiteBytes(bytes){
  if(dbStorageMode==='local'){await localDbPut(bytes);return;}
  const w=await sqliteFileHandle.createWritable();await w.write(bytes);await w.close();
}
async function openLocalDatabase(silent){
  if(!SQL){toast('SQLite ainda está carregando. Tente novamente.');return false;}
  try{
    const bytes=await localDbGet();
    if(bytes&&bytes.byteLength){
      sqliteDb=new SQL.Database(bytes);createSQLiteDatabase();
      db=JSON.parse(JSON.stringify(base));
      if(!readStateFromSQLite()) throw new Error('A base local não contém dados válidos do Ricas Finanças.');
    }else{
      sqliteDb=new SQL.Database();createSQLiteDatabase();
      db=JSON.parse(JSON.stringify(base));normalizeCardData();normalizeOrders();
    }
    dbReady=true;dbStorageMode='local';
    if(navigator.storage?.persist){try{await navigator.storage.persist();}catch(_){}}
    if(!bytes) await persistSQLite();
    if(!silent){toast(bytes?'🟢 Base local do dispositivo conectada':'🟢 Nova base local criada no dispositivo');render();}
    return true;
  }catch(e){
    console.error('openLocalDatabase:',e);dbReady=false;dbStorageMode='disconnected';
    toast('Não foi possível abrir a base local: '+(e?.message||e));return false;
  }
}
async function deliverFile(blob,filename){
  try{
    if(navigator.canShare&&typeof File!=='undefined'){
      const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return 'share';}
    }
  }catch(e){
    if(e?.name==='AbortError') return 'cancel';
    console.warn('Compartilhamento indisponível, usando download:',e);
  }
  downloadBlob(blob,filename);
  return 'download';
}
function stampForFile(){return new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');}
async function exportSQLiteFile(){
  if(!storageConnected()) return toast('Conecte a base antes de exportar.');
  if(!await persistSQLite()) return;
  const r=await deliverFile(new Blob([sqliteDb.export()],{type:'application/x-sqlite3'}),`ricas-financas-${stampForFile()}.sqlite`);
  if(r!=='cancel') toast('Arquivo .sqlite exportado.');
}
async function importSQLiteFile(inp){
  const file=inp.files?.[0];if(!file)return;
  try{
    if(!SQL) throw new Error('SQLite ainda está carregando.');
    if(hasFsApi()&&!storageConnected()) throw new Error('Conecte primeiro o banco de destino (ou crie uma base nova).');
    const bytes=new Uint8Array(await file.arrayBuffer());
    if(!bytes.byteLength) throw new Error('Arquivo vazio.');
    const check=new SQL.Database(bytes);
    try{
      const r=check.exec("SELECT key FROM app_state WHERE key IN ('accounts','categories','transactions')");
      if(!r.length||r[0].values.length<3) throw new Error('O arquivo não contém uma base válida do Ricas Finanças.');
    }finally{check.close();}
    if(!confirm(`IMPORTAR BASE SQLITE\n\nArquivo: ${file.name}\n\nOs dados atuais ${dbStorageMode==='local'||!hasFsApi()?'da base local deste dispositivo':'do banco conectado'} serão SUBSTITUÍDOS pelo conteúdo do arquivo.\n\nDeseja continuar?`))return;
    const old={db,sqliteDb,dbReady,dbStorageMode};
    try{
      sqliteDb=new SQL.Database(bytes);createSQLiteDatabase();
      db=JSON.parse(JSON.stringify(base));readStateFromSQLite();
      if(!hasFsApi()) dbStorageMode='local';
      dbReady=true;
      if(!await persistSQLite()) throw new Error('Falha ao gravar.');
    }catch(e){db=old.db;sqliteDb=old.sqliteDb;dbReady=old.dbReady;dbStorageMode=old.dbStorageMode;throw e;}
    toast('Base importada com sucesso.');render();
  }catch(e){console.error('importSQLiteFile:',e);toast('Importação não concluída: '+(e?.message||e));}
  finally{inp.value='';}
}

async function saveHandleForNextOpen(){
  try{
    if(navigator.storage?.persist) await navigator.storage.persist();
    if(window.localStorage && dbDirHandle){
      // FileSystemHandle is structured-cloneable in IndexedDB, not localStorage.
      const req=indexedDB.open('ricas_financas_handles',1);
      req.onupgradeneeded=()=>req.result.createObjectStore('handles');
      req.onsuccess=()=>{
        const tx=req.result.transaction('handles','readwrite');
        tx.objectStore('handles').put(dbDirHandle,DB_HANDLE_KEY);
      };
    }
  }catch(e){console.warn('Não foi possível memorizar a pasta:',e)}
}
async function getSavedHandle(){
  return new Promise(resolve=>{
    try{
      const req=indexedDB.open('ricas_financas_handles',1);
      req.onupgradeneeded=()=>req.result.createObjectStore('handles');
      req.onerror=()=>resolve(null);
      req.onsuccess=()=>{
        const tx=req.result.transaction('handles','readonly');
        const q=tx.objectStore('handles').get(DB_HANDLE_KEY);
        q.onsuccess=()=>resolve(q.result||null);
        q.onerror=()=>resolve(null);
      };
    }catch(e){resolve(null)}
  });
}
async function openSQLiteFromDirectory(dirHandle){
  if(!dirHandle) return false;
  try{
    let permission=await dirHandle.queryPermission({mode:'readwrite'});
    if(permission!=='granted') permission=await dirHandle.requestPermission({mode:'readwrite'});
    if(permission!=='granted') throw new Error('Permissão de gravação na pasta não concedida.');

    dbDirHandle=dirHandle;

    // IMPORTANT: connecting to a folder must NEVER create/overwrite a DB.
    // If the DB exists, open it. If it does not, create it only as an empty/new DB.
    // Explicit creation of a clean DB is handled by createCleanSQLite().
    let existingFile=null;
    try{
      existingFile=await dbDirHandle.getFileHandle(SQLITE_FILE,{create:false});
    }catch(e){
      existingFile=null;
    }

    if(existingFile){
      sqliteFileHandle=existingFile;
      const file=await sqliteFileHandle.getFile();
      const buf=await file.arrayBuffer();
      if(!buf.byteLength) throw new Error('O arquivo ricas-financas.sqlite existe, mas está vazio ou inválido.');

      sqliteDb=new SQL.Database(new Uint8Array(buf));
      createSQLiteDatabase();

      if(!readStateFromSQLite()){
        throw new Error('A base SQLite existe, mas não contém uma base válida do Ricas Finanças.');
      }
    }else{
      // No DB exists: create a brand-new database, without touching any existing file.
      sqliteFileHandle=await dbDirHandle.getFileHandle(SQLITE_FILE,{create:true});
      sqliteDb=new SQL.Database();
      createSQLiteDatabase();
      db=JSON.parse(JSON.stringify(base));
      normalizeCardData();
      normalizeOrders();
      dbReady=true;
      dbStorageMode='sqlite';
      await persistSQLite();
    }

    dbReady=true;
    dbStorageMode='sqlite';
    await saveHandleForNextOpen();
    return true;
  }catch(e){
    console.error('openSQLiteFromDirectory:',e);
    dbReady=false;
    dbStorageMode='disconnected';
    throw e;
  }
}

async function openSQLiteFile(fileHandle){

    if(permission!=='granted') permission=await fileHandle.requestPermission({mode:'readwrite'});

    sqliteFileHandle=fileHandle;
    const file=await sqliteFileHandle.getFile();

    dbStorageMode='sqlite';

    dbStorageMode='disconnected';
    throw e;
  }
}

async function createCleanSQLite(){
  if(!SQL){toast('SQLite ainda está carregando.');return;}
  if(!hasFsApi()){
    const existing=await localDbGet();
    if(existing&&!confirm('CRIAR NOVA BASE LOCAL\n\nJá existe uma base neste dispositivo. Ela será APAGADA e substituída por uma base vazia.\n\nRecomenda-se gerar antes um backup completo (.ZIP) ou exportar o arquivo .sqlite.\n\nDeseja continuar?'))return;
    if(existing&&!confirm('CONFIRMAÇÃO FINAL\n\nOs dados atuais deste dispositivo serão perdidos. Continuar?'))return;
    try{
      sqliteDb=new SQL.Database();createSQLiteDatabase();
      db=JSON.parse(JSON.stringify(base));normalizeCardData();normalizeOrders();
      dbReady=true;dbStorageMode='local';
      if(!await persistSQLite()) throw new Error('Falha ao gravar.');
      toast('🟢 Nova base local criada');render();
    }catch(e){toast('Não foi possível criar a base: '+(e?.message||e));}
    return;
  }

  try{
    if(!confirm('CRIAR NOVA BASE SQLITE\n\nEsta operação cria uma base nova e vazia. Se você escolher um arquivo existente, ele NÃO será sobrescrito automaticamente.\n\nPara preservar sua base atual, escolha outra pasta ou outro nome de arquivo.\n\nDeseja continuar?'))return;

    let targetHandle=null;

    if(window.showDirectoryPicker){
      const dir=await window.showDirectoryPicker({mode:'readwrite'});
      let permission=await dir.queryPermission({mode:'readwrite'});
      if(permission!=='granted')permission=await dir.requestPermission({mode:'readwrite'});
      if(permission!=='granted')throw new Error('Permissão de gravação na pasta não concedida.');

      // Never overwrite an existing DB.
      try{
        targetHandle=await dir.getFileHandle(SQLITE_FILE,{create:false});
        toast('Já existe uma base nessa pasta. Ela NÃO foi apagada. Escolha outra pasta para criar uma base limpa.');
        return;
      }catch(_){}

      dbDirHandle=dir;
      sqliteFileHandle=await dir.getFileHandle(SQLITE_FILE,{create:true});
    }else if(window.showSaveFilePicker){
      targetHandle=await window.showSaveFilePicker({
        suggestedName:SQLITE_FILE,
        types:[{description:'Banco SQLite',accept:{'application/x-sqlite3':['.sqlite','.db']}}]}
      );
      sqliteFileHandle=targetHandle;
    }else{
      throw new Error('Seu navegador não permite selecionar pasta/arquivo. Use Chrome ou Edge atualizado.');
    }

    sqliteDb=new SQL.Database();
    createSQLiteDatabase();
    db=JSON.parse(JSON.stringify(base));
    normalizeCardData();
    normalizeOrders();
    dbReady=true;
    dbStorageMode='sqlite';

    if(!await persistSQLite()) throw new Error('Não foi possível gravar a nova base SQLite.');
    await saveHandleForNextOpen();
    render();
    toast('🟢 Nova base SQLite criada e conectada');
  }catch(e){
    console.error('createCleanSQLite:',e);
    dbReady=false;
    dbStorageMode='disconnected';
    toast('Não foi possível criar a base SQLite: '+(e?.message||e));
  }
}

// Partida dobrada simplificada: receita = crédito/entrada (+); despesa = débito/saída (-); transferência não altera o resultado líquido.
function balance(id){
  return db.accounts.filter(a=>(!id||a.id==id)).reduce((s,a)=>s+(+a.initial||0),0)+
    db.transactions.filter(t=>(!id||t.accountId==id)&&!t.cardId&&t.confirmed===true).reduce((s,t)=>s+(t.type==='receita'?1:-1)*+t.value,0)
}
function summaryAccounts(){return db.accounts.filter(a=>a.showInSummary!==false)}
function forecastMonthBalance(){
  const k=selectedMonthKey();
  // Ponto de partida: saldo atual das contas que aparecem no Resumo.
  // Contas marcadas para não aparecer no Resumo são integralmente excluídas.
  const base=summaryAccounts().reduce((total,a)=>{
    const confirmed=db.transactions
      .filter(t=>t.accountId==a.id&&!t.cardId&&!t.transfer&&t.confirmed===true)
      .reduce((s,t)=>s+(t.type==='receita'?1:-1)*+t.value,0);
    return total + (+a.initialBalance||0) + confirmed;
  },0);

  // Projeção do mês selecionado: acrescenta receitas e despesas ainda
  // previstas/pendentes daquele mês. Lançamentos já confirmados também
  // fazem parte do saldo projetado apenas uma vez, por isso partimos do
  // saldo atual e adicionamos somente os pendentes do mês.
  const pending=db.transactions
    .filter(t=>monthKey(t.date)===k&&!t.cardId&&!t.transfer&&t.confirmed!==true&&summaryAccounts().some(a=>a.id==t.accountId))
    .reduce((s,t)=>s+(t.type==='receita'?1:-1)*+t.value,0);

  return base + pending;
}

function estimatedMonthBalance(){
  const k=selectedMonthKey();
  return db.transactions
    .filter(t=>monthKey(t.date)===k && !t.cardId && !t.transfer && summaryAccounts().some(a=>a.id==t.accountId))

function summaryBalance(){
  const k=selectedMonthKey();
  return db.transactions
    .filter(t=>monthKey(t.date)===k && !t.cardId && !t.transfer && t.confirmed===true && summaryAccounts().some(a=>a.id==t.accountId))

function addMonthsSafe(date,n){
  const d=new Date(date+'T12:00:00');
  const day=d.getDate();
  d.setMonth(d.getMonth()+n);
  if(d.getDate()!==day)d.setDate(0);
  return d.toISOString().slice(0,10);
}
function installmentDescription(description, installment, total){
  const base=String(description||'').trim();
  return `${base} (${installment}/${total})`;
}
// Automatizações:
//  • mode 'installments' (parcelada): gera exatamente r.count lançamentos "Descrição (n/N)".
//  • mode 'recurring' (recorrente): repete todo mês sem fim definido. Os lançamentos são criados
//    sempre RECURRING_AHEAD_MONTHS meses à frente (e até o mês que estiver sendo visualizado);
//    conforme o tempo passa, novos meses são gerados automaticamente.
//  r.skip = parcelas excluídas individualmente (não são recriadas); r.endIdx = última ocorrência (recorrência encerrada).
const RECURRING_AHEAD_MONTHS=12;
function isRecurring(r){return r&&r.mode==='recurring';}
// Parcela em que a automatização começa a lançar.
// Permite cadastrar uma compra já em andamento (ex.: começar na 45/392) sem criar as parcelas passadas.
// A data informada passa a ser o vencimento dessa parcela inicial.
function recStartIdx(r){
  if(!r||isRecurring(r))return 1;
  const n=Number(r.startIdx);
  return Number.isFinite(n)&&n>=1?Math.floor(n):1;
}
function recOccurrenceDate(r,n){return addMonthsSafe(r.start,Number(n)-recStartIdx(r));}
function recurrenceHorizonIdx(r){
  const s=new Date(r.start+'T12:00:00');
  const now=new Date();
  const ahead=new Date(now.getFullYear(),now.getMonth()+RECURRING_AHEAD_MONTHS,1);
  const target=selectedMonth>ahead?selectedMonth:ahead;
  return Math.max(1,(target.getFullYear()-s.getFullYear())*12+(target.getMonth()-s.getMonth())+1);
}
function generateRecurrence(r){
  if(!r)return 0;
  const payment=recurrenceCardData(r);
  if(!payment||(r.cardId&&r.type!=='despesa'))return 0;
  const mine=db.transactions.filter(t=>t.recurrenceId===r.id);
  const existingIdx=new Set(mine.map(t=>Number(t.installment)).filter(Boolean));
  const existingDates=new Set(mine.map(t=>t.date));
  const skip=new Set((r.skip||[]).map(Number));
  const recurring=isRecurring(r);
  let last=recurring?recurrenceHorizonIdx(r):Number(r.count||0);
  if(recurring&&r.endIdx!=null)last=Math.min(last,Number(r.endIdx));
  const first=recurring?1:recStartIdx(r);
  let added=0;
  for(let n=first;n<=last;n++){
    if(existingIdx.has(n)||skip.has(n))continue;
    const date=recOccurrenceDate(r,n);
    if(!recurring&&existingDates.has(date))continue;
    db.transactions.push({
      id:uid(),type:r.type,date,description:recurring?String(r.description||'').trim():installmentDescription(r.description,n,r.count),
      value:+r.value,...recurrenceOccurrencePayment(r,n,date),categoryId:+r.categoryId,
      // Parcelamento no cartão já foi efetivado na compra: nasce confirmado.
      // Recorrentes (assinaturas, mensalidades) nascem pendentes, pois a cobrança ainda vai ocorrer.
      confirmed:(!recurring&&!!r.cardId),recurrenceId:r.id,installment:n,totalInstallments:recurring?null:r.count,recurring:recurring||undefined
    });
    added++;
  }
  return added;
}
// Mantém as recorrências sempre preenchidas à frente; chamado a cada renderização.
function ensureRecurringTransactions(){
  if(!Array.isArray(db.recurrences))return;
  let added=0;
  db.recurrences.filter(isRecurring).forEach(r=>added+=generateRecurrence(r));
  if(added&&typeof storageConnected==='function'&&storageConnected())save();
}

  const startIdx=Number(document.getElementById('recStartIdxInput')?.value)||1;
  // Rótulo da data acompanha a parcela inicial escolhida.
  const dateLabel=document.getElementById('recDateLabel');
  const useCard=document.getElementById('recPaymentSelect')?.value==='card';
  if(dateLabel&&!recurring){
    dateLabel.textContent=startIdx>1
      ? (useCard?`Data da parcela nº ${startIdx}`:`Vencimento da parcela nº ${startIdx}`)
      : (useCard?'Data da primeira compra/cobrança':'Primeiro vencimento');
  }
  if(recurring||!Number.isFinite(total)||total<1){box.hidden=true;return;}
  if(startIdx>total){
    box.hidden=false;box.className='rec-range-hint rec-range-error';
    box.innerHTML=`A parcela inicial (${startIdx}) não pode ser maior que o total (${total}).`;
    return;
  }
  const qtd=total-startIdx+1;
  box.hidden=false;box.className='rec-range-hint';
  box.innerHTML=startIdx>1
    ? `Serão lançadas as parcelas <b>${startIdx}/${total}</b> até <b>${total}/${total}</b> — ${qtd} lançamento(s). As ${startIdx-1} parcelas anteriores não serão criadas.`
    : `Serão lançadas as parcelas <b>1/${total}</b> até <b>${total}/${total}</b> — ${qtd} lançamento(s).`;
}

function recurrenceCardData(r){
  if(!r.cardId)return {cardId:null,cardHolder:undefined,merchant:undefined,accountId:Number(r.accountId)||0};
  const card=db.cards.find(c=>String(c.id)===String(r.cardId));
  if(!card)return null; // Nunca converter cartão excluído em débito bancário silenciosamente.
  return {cardId:card.id,cardHolder:r.cardHolder==='additional'&&(card.hasAdditional||card.additionalName)?'additional':'principal',merchant:String(r.merchant||'').trim()||undefined,accountId:Number(card.accountId)||0};
}

function recurrenceOccurrencePayment(r,n,date){
  const payment=recurrenceCardData(r);
  if(!payment)return null;
  if(!r.cardId)return {...payment,automationBillingMonth:null,automationBillingDate:null,automationBillingCardId:null};
  const card=db.cards.find(c=>String(c.id)===String(r.cardId));
  const first=cardBillingMonth(r.start,card);
  const [y,m]=first.split('-').map(Number);
  const offset=Number(n)-recStartIdx(r);
  return {...payment,automationBillingMonth:monthKeyFromDate(new Date(y,m-1+offset,1)),automationBillingDate:date,automationBillingCardId:card.id};
}
function saveRecurrence(e,id){
  e.preventDefault();
  const f=new FormData(e.target);
  const mode=f.get('mode')==='recurring'?'recurring':(f.get('mode')==='installments'?'installments':'');
  if(!mode)return toast('Selecione a modalidade.');
  if(!f.get('type'))return toast('Selecione o tipo.');
  const paymentMethod=f.get('paymentMethod');
  if(!['account','card'].includes(paymentMethod))return toast('Selecione a forma de lançamento.');
  const card=paymentMethod==='card'?db.cards.find(c=>String(c.id)===String(f.get('cardId'))):null;
  if(paymentMethod==='card'&&!card)return toast('Selecione um cartão válido.');
  if(card&&f.get('type')!=='despesa')return toast('Cartão de crédito aceita somente despesas.');
  if(!card&&!f.get('accountId'))return toast('Selecione a conta.');
  if(card&&!['principal','additional'].includes(f.get('cardHolder')))return toast('Selecione o titular.');
  if(card&&f.get('cardHolder')==='additional'&&!(card.hasAdditional||card.additionalName))return toast('Este cartão não possui adicional.');
  if(!f.get('categoryId'))return toast('Selecione a categoria.');
  const data={mode,type:f.get('type'),start:String(f.get('start')||''),description:String(f.get('description')||'').trim(),
    value:parseDecimalBR(f.get('value')),count:mode==='recurring'?null:+f.get('count'),
    startIdx:mode==='recurring'?null:Math.max(1,Math.floor(Number(f.get('startIdx'))||1)),accountId:card?(Number(card.accountId)||0):+f.get('accountId'),categoryId:+f.get('categoryId'),cardId:card?card.id:null,cardHolder:card?f.get('cardHolder'):undefined,merchant:card?(String(f.get('merchant')||'').trim()||undefined):undefined};
  if(!data.start)return toast('Informe o primeiro vencimento.');
  if(!(data.value>0))return toast('Informe um valor maior que zero.');
  if(mode==='installments'&&!(data.count>=1))return toast('Informe o número total de parcelas.');
  if(mode==='installments'&&data.startIdx>data.count)return toast(`A parcela inicial (${data.startIdx}) não pode ser maior que o total (${data.count}).`);
  if(!id){
    const r={id:uid(),...data,skip:[],order:db.recurrences.length};
    db.recurrences.push(r);
    let n=0;
    if(mode==='recurring'||f.get('generateNow')==='on')n=generateRecurrence(r);
    save();closeModal();
    toast(mode==='recurring'
      ?`Recorrência mensal criada (${n} meses já lançados)`
      :(r.startIdx>1?`Parcelas ${r.startIdx}/${r.count} a ${r.count}/${r.count} programadas`:`${r.count} movimentações programadas`));
    render();return;
  }
  const r=db.recurrences.find(x=>x.id==id);if(!r)return;
  const pending=db.transactions.filter(t=>t.recurrenceId===r.id&&t.confirmed!==true);
  const confirmedCount=db.transactions.filter(t=>t.recurrenceId===r.id&&t.confirmed===true).length;
  let apply=false;
  if(pending.length){
    apply=confirm(`APLICAR AOS LANÇAMENTOS JÁ GERADOS?\n\nExistem ${pending.length} lançamento(s) pendente(s) desta automatização${confirmedCount?` e ${confirmedCount} confirmado(s)`:''}.\n\nOK = atualizar também os ${pending.length} pendente(s) (tipo, descrição, valor, conta, categoria e datas).\nCancelar = alterar somente a regra; os próximos meses gerados seguirão os novos dados.\n\nLançamentos confirmados nunca são alterados.`);
  }
  const wasRecurring=isRecurring(r);
  Object.assign(r,data);
  if(mode==='installments'){delete r.endIdx;delete r.endedAt;}
  if(mode==='recurring'&&!wasRecurring){delete r.endIdx;delete r.endedAt;}
  if(apply){
    const rec=mode==='recurring';
    pending.forEach(t=>{
      const n=Number(t.installment)||1;
      const occDate=rec?addMonthsSafe(r.start,n-1):recOccurrenceDate(r,n);
      Object.assign(t,{type:r.type,value:+r.value,...recurrenceOccurrencePayment(r,n,occDate),categoryId:+r.categoryId,
        date:occDate,
        description:rec?r.description:installmentDescription(r.description,n,r.count),
        totalInstallments:rec?null:r.count,recurring:rec||undefined,
        confirmed:(!rec&&!!r.cardId)?true:t.confirmed});
    });
    if(!rec){
      // Remove pendentes fora do novo intervalo (abaixo da parcela inicial ou acima do total).
      const first=recStartIdx(r);
      const drop=new Set(pending.filter(t=>{const n=Number(t.installment)||1;return n>r.count||n<first;}).map(t=>t.id));
      if(drop.size)db.transactions=db.transactions.filter(t=>!drop.has(t.id));
    }
  }
  const added=generateRecurrence(r);
  save();closeModal();
  toast(`Automatização alterada${apply?` · ${pending.length} pendente(s) atualizado(s)`:''}${added?` · ${added} novo(s) lançamento(s)`:''}`);
  render();
}
function endRecurrence(id){
  const r=db.recurrences.find(x=>x.id==id);if(!r)return;
  const todayKey=localDateKey();
  const pendingFuture=db.transactions.filter(t=>t.recurrenceId===r.id&&t.confirmed!==true&&String(t.date)>todayKey);
  if(!confirm(`ENCERRAR RECORRÊNCIA\n\n"${r.description}"\n\nNovos meses deixarão de ser gerados. ${pendingFuture.length} lançamento(s) futuro(s) ainda pendente(s) (após hoje) serão removidos.\nLançamentos de hoje para trás e os já confirmados serão mantidos.\n\nDeseja continuar?`))return;
  const ids=new Set(pendingFuture.map(t=>t.id));
  db.transactions=db.transactions.filter(t=>!ids.has(t.id));
  const kept=db.transactions.filter(t=>t.recurrenceId===r.id).map(t=>Number(t.installment)||0);
  r.endIdx=Math.max(0,...kept);
  r.endedAt=todayKey;
  save();toast('Recorrência encerrada');render();
}
function reactivateRecurrence(id){
  const r=db.recurrences.find(x=>x.id==id);if(!r)return;
  if(!confirm(`Reativar a recorrência "${r.description}"?\n\nOs meses futuros voltarão a ser gerados automaticamente.`))return;
  delete r.endIdx;delete r.endedAt;
  generateRecurrence(r);save();toast('Recorrência reativada');render();
}

function reportRange(){
  const mode=document.getElementById('reportPeriod')?.value||'monthly';
  const base=new Date(selectedMonthKey()+'-01T00:00:00');
  let start=new Date(base),end=new Date(base);
  if(mode==='monthly') end=new Date(base.getFullYear(),base.getMonth()+1,0);
  else if(mode==='semester'){start=new Date(base.getFullYear(),base.getMonth()<6?0:6,1);end=new Date(start.getFullYear(),start.getMonth()+6,0);}
  else if(mode==='annual'){start=new Date(base.getFullYear(),0,1);end=new Date(base.getFullYear()+1,0,0);}
  else {start=new Date(document.getElementById('reportStart').value+'T00:00:00');end=new Date(document.getElementById('reportEnd').value+'T23:59:59');}
  return {start,end};
}

function reportMonthsInRange(r){
  const out=[];let d=new Date(r.start.getFullYear(),r.start.getMonth(),1);
  const end=new Date(r.end.getFullYear(),r.end.getMonth(),1);
  while(d<=end&&out.length<240){out.push(monthKeyFromDate(d));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  return out;
}
// Grupo do orçamento de um lançamento para fins de FILTRO:
//  • despesas → grupo da categoria ('' = sem grupo);
//  • transferência enviada para conta marcada como "conta de investimentos" → 'investimentos';
//  • receitas e demais transferências → null (não pertencem a nenhum grupo de gasto).
function txFilterGroup(t){
  if(!t)return null;
  if(t.transfer){
    if(t.type!=='despesa')return null;
    const tr=(db.transfers||[]).find(x=>String(x.id)===String(t.transferId));
    const to=tr&&db.accounts.find(a=>String(a.id)===String(tr.to)),from=tr&&db.accounts.find(a=>String(a.id)===String(tr.from));
    return to?.investmentAccount&&!from?.investmentAccount?'investimentos':null;
  }
  if(t.type!=='despesa')return null;
  return budgetGroupOfTx(t);
}
function matchesGroupFilter(t,gf){
  if(!gf||gf==='all')return true;
  const g=txFilterGroup(t);
  return g!==null&&g===(gf==='none'?'':gf);
}
function groupFilterLabel(gf){
  if(!gf||gf==='all')return 'Todos os grupos';
  if(gf==='none')return '❔ Sem grupo';
  const g=budgetGroupDef(gf);return g?`${g.icon} ${g.name}`:'—';
}
function txGroupName(t){
  if(!t)return 'Não aplicável';
  const key=txFilterGroup(t);
  if(key===null)return 'Não aplicável';
  if(key==='')return 'Sem grupo';
  return budgetGroupDef(key)?.name||'Sem grupo';
}
function groupFilterOptions(gf){
  return `<option value="all" ${(!gf||gf==='all')?'selected':''}>Todos os grupos</option>`+
    BUDGET_GROUPS_DEFAULT.map(g=>`<option value="${g.key}" ${gf===g.key?'selected':''}>${g.icon} ${esc(g.name)}</option>`).join('')+
    `<option value="none" ${gf==='none'?'selected':''}>❔ Sem grupo</option>`;
}
function categoryInGroup(c,gf){
  if(!gf||gf==='all')return true;
  if(c.type!=='despesa')return false;
  return (budgetGroupDef(c.budgetGroup)?c.budgetGroup:'')===(gf==='none'?'':gf);
}
function setDashboardGroupFilter(v){
  window.dashboardGroupFilter=v||'all';
  // Se a categoria escolhida não pertence ao grupo, volta para todas.
  const sc=String(window.dashboardCategoryFilter||'all');
  if(sc!=='all'){const c=db.categories.find(x=>String(x.id)===sc);if(!c||!categoryInGroup(c,window.dashboardGroupFilter))window.dashboardCategoryFilter='all';}
  dashboard();
}
function budgetGroupOfTx(t){
  const c=db.categories.find(x=>String(x.id)===String(t.categoryId));
  return (c&&budgetGroupDef(c.budgetGroup))?c.budgetGroup:'';
}
function budgetReportData(r,af){
  const months=reportMonthsInRange(r);
  const empty=()=>({confirmed:0,total:0});
  const perMonth={};
  months.forEach(m=>{perMonth[m]={income:budgetIncome(m),g:{}};BUDGET_GROUPS_DEFAULT.forEach(g=>perMonth[m].g[g.key]=empty());perMonth[m].g['']=empty();});
  (db.transactions||[]).filter(t=>t.type==='despesa'&&!t.transfer&&reportDateInRange(txCashDate(t),r)&&(af==='all'||String(t.accountId)===String(af))).forEach(t=>{
    const m=txCashMonth(t);if(!perMonth[m])return;
    const x=perMonth[m].g[budgetGroupOfTx(t)],v=Number(t.value||0);
    x.total+=v;if(t.confirmed===true)x.confirmed+=v;
  });
  (db.transfers||[]).filter(tr=>reportDateInRange(tr.date,r)).forEach(tr=>{
    const to=db.accounts.find(a=>String(a.id)===String(tr.to)),from=db.accounts.find(a=>String(a.id)===String(tr.from));
    if(!to?.investmentAccount||from?.investmentAccount)return;
    if(af!=='all'&&String(tr.from)!==String(af)&&String(tr.to)!==String(af))return;
    const m=monthKey(tr.date);if(!perMonth[m])return;
    const v=Number(tr.value||0);perMonth[m].g.investimentos.total+=v;perMonth[m].g.investimentos.confirmed+=v;
  });
  const income=months.reduce((s,m)=>s+perMonth[m].income,0);
  const groups=BUDGET_GROUPS_DEFAULT.map(g=>{
    const pct=budgetPercent(g.key);
    const planned=months.reduce((s,m)=>s+perMonth[m].income*pct/100,0);
    const confirmed=months.reduce((s,m)=>s+perMonth[m].g[g.key].confirmed,0);
    const total=months.reduce((s,m)=>s+perMonth[m].g[g.key].total,0);
    return {...g,pct,planned,confirmed,total};
  });
  const ungrouped={confirmed:months.reduce((s,m)=>s+perMonth[m].g[''].confirmed,0),total:months.reduce((s,m)=>s+perMonth[m].g[''].total,0)};
  return {months,perMonth,income,groups,ungrouped};
}
function budgetReportHtml(r,af,gf){
  const bd=budgetReportData(r,af);
  gf=gf||'all';
  // Com filtro de grupo, barras e evolução mostram somente aquele grupo; a pizza mantém todos para comparação.
  const shownGroups=gf==='all'||gf==='none'?bd.groups:bd.groups.filter(g=>g.key===gf);
  const fmtPct=v=>(Number.isFinite(v)?v:0).toFixed(1)+'%';
  const maxV=Math.max(1,...shownGroups.map(g=>Math.max(g.planned,g.total)));
  const bars=shownGroups.map(g=>{
    const use=g.planned>0?g.total/g.planned*100:(g.total>0?100:0);
    const st=g.key==='investimentos'||g.key==='conhecimento'||g.key==='metas'
      ? (use>=100?'✅ meta atingida':use>=70?'🟡 em andamento':'🔴 abaixo da meta')
      : (use>100?'🔴 acima do limite':use>85?'🟡 próximo do limite':'✅ dentro do limite');
    return `<div class="bgr-row">
      <div><span class="category-icon">${g.icon}</span><b>${esc(g.name)}</b><div class="bgr-vals">${st}</div></div>
      <div><div class="bgr-track">
        <div class="bgr-bar planned" onclick="toast(this.title)" style="width:${g.planned/maxV*100}%;background:${g.color}" title="Planejado: ${money(g.planned)}"></div>
        <div class="bgr-bar commit" onclick="toast(this.title)" style="width:${g.total/maxV*100}%;background:${g.color}" title="Comprometido: ${money(g.total)}"></div>
        <div class="bgr-bar real" onclick="toast(this.title)" style="width:${g.confirmed/maxV*100}%;background:${g.color}" title="Realizado: ${money(g.confirmed)}"></div>
      </div><div class="bgr-vals">Planejado ${money(g.planned)} · Realizado ${money(g.confirmed)} · Comprometido ${money(g.total)} · Uso ${fmtPct(use)}</div></div>
    </div>`;
  }).join('');
  const pieItems=[...bd.groups.map(g=>({c:{id:g.key,name:g.name,color:g.color},v:g.confirmed,meta:g.pct,icon:g.icon})),
    {c:{id:'',name:'Sem grupo',color:'#9ca3af'},v:bd.ungrouped.confirmed,meta:null,icon:'❔'}];
  const active=pieItems.filter(x=>x.v>0);
  const totConf=active.reduce((s,x)=>s+x.v,0);
  const pie=active.length?`<svg viewBox="0 0 100 100" role="img" aria-label="Distribuição real dos gastos por grupo">${summaryPieGeometry(active).map(g=>`<path d="${g.path}" fill="${g.c.color}" stroke="#fff" stroke-width="1.2"><title>${esc(g.c.name)} — ${money(g.v)} (${g.percent.toFixed(1)}%)</title></path>`).join('')}<circle cx="50" cy="50" r="24" fill="#fff"/><text x="50" y="48" text-anchor="middle" font-size="5" fill="#6b7280">Realizado</text><text x="50" y="55" text-anchor="middle" font-size="5.2" font-weight="700" fill="#17202a">${esc(money(totConf))}</text></svg>`:'<div class="summary-pie-empty">Sem despesas confirmadas no período.</div>';
  const pieLegend=`<div class="distribution-groups">${pieItems.map(x=>{
    const real=bd.income?x.v/bd.income*100:0,dev=x.meta==null?null:real-x.meta;
    const hl=gf!=='all'&&String(x.c.id)===(gf==='none'?'':gf);
    return `<section class="distribution-group${hl?' distribution-selected':''}" style="--group-color:${x.c.color}">
      <h3><span class="distribution-dot"></span><span>${x.icon} ${esc(x.c.name)}</span></h3>
      <dl><div><dt>Real / receita</dt><dd>${fmtPct(real)}</dd></div><div><dt>Meta</dt><dd>${x.meta==null?'—':fmtPct(x.meta)}</dd></div><div><dt>Desvio</dt><dd class="${dev==null?'':dev>0?'red':'blue'}">${dev==null?'—':(dev>0?'+':'')+dev.toFixed(1)+' p.p.'}</dd></div></dl>
    </section>`;
  }).join('')}</div>`;
  const monthUse=bd.months.map(m=>{
    const pm=bd.perMonth[m];
    return {m,vals:shownGroups.map(g=>{const pl=pm.income*g.pct/100,v=pm.g[g.key].total;return {g,pl,v,u:pl>0?v/pl*100:(v>0?100:0)};})};
  });
  const maxU=Math.max(120,...monthUse.flatMap(x=>x.vals.map(v=>v.u)));
  const H=200, refTop=H-(100/maxU*H);
  const evo=bd.months.length>1?`<div class="card section"><h2>Desempenho mensal por grupo (% do planejado)</h2>
    <div class="muted">Cada barra mostra o comprometido do grupo em relação ao planejado do mês. A linha tracejada marca 100%. Para Custos fixos, Conforto e Prazeres, ficar abaixo da linha é o desejável; para Metas, Investimentos e Conhecimento, o objetivo é alcançá-la.</div>

  </div>`:'';
  const partial=(r.start.getDate()!==1)||(new Date(r.end.getFullYear(),r.end.getMonth()+1,0).getDate()!==r.end.getDate());
  return `<div class="card section"><h2>📊 Divisão do orçamento — desempenho no período</h2>
    <div class="muted">Receita base: ${money(bd.income)} em ${bd.months.length} mês(es), conforme a regra definida em Categorias. Este bloco considera o filtro de conta; os filtros de tipo e de categoria não se aplicam.${partial?' <b>Atenção:</b> o período personalizado não cobre meses completos; o planejado usa a receita base dos meses inteiros.':''}</div>
    <div class="grid g2 section">
      <div class="card"><h2>Planejado × realizado por grupo</h2>
        <div class="bgr-legend"><span><i style="background:#9ca3af;opacity:.35"></i>Planejado</span><span><i style="background:#9ca3af"></i>Realizado (confirmado)</span><span><i style="background:#9ca3af;opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 3px,#fff8 3px 6px)"></i>Comprometido (inclui pendentes)</span></div>
        ${bars}</div>
      <div class="card"><h2>Distribuição real × meta</h2>
        <div class="distribution-layout"><div class="distribution-chart">${pie}</div><div class="distribution-data">${pieLegend}</div></div></div>
    </div>
    ${evo}
  </div>`;
}

const PDF_CP1252={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F,0x2212:0x2D,0x202F:0xA0};
function pdfCodes(str){
  const out=[];
  for(const ch of String(str??'')){
    const u=ch.codePointAt(0);
    if(u>=32&&u<127||u>=0xA0&&u<=0xFF)out.push(u);
    else if(PDF_CP1252[u])out.push(PDF_CP1252[u]);
    // demais caracteres (emojis, símbolos) são omitidos
  }
  // remove espaços duplicados deixados por emojis omitidos
  return out.filter((c,i,a)=>!(c===32&&(i===0||a[i-1]===32)));
}
class MiniPDF{
  constructor(){this.W=595.28;this.H=841.89;this.pages=[];this.addPage();}
  addPage(){this.cur=[];this.pages.push(this.cur);return this;}
  static rgb(hex){const h=String(hex||'#000').replace('#','');const n=h.length===3?h.split('').map(x=>x+x).join(''):h.padEnd(6,'0');return [0,2,4].map(i=>(parseInt(n.slice(i,i+2),16)/255).toFixed(3)).join(' ');}
  static n(v){return (Math.round(v*100)/100).toString();}
  rect(x,y,w,h,fill){if(w<=0||h<=0)return;this.cur.push(`${MiniPDF.rgb(fill)} rg ${MiniPDF.n(x)} ${MiniPDF.n(this.H-y-h)} ${MiniPDF.n(w)} ${MiniPDF.n(h)} re f`);}
  line(x1,y1,x2,y2,color='#e6e9ef',width=0.6,dash){this.cur.push(`${dash?'[3 2] 0 d ':''}${MiniPDF.rgb(color)} RG ${width} w ${MiniPDF.n(x1)} ${MiniPDF.n(this.H-y1)} m ${MiniPDF.n(x2)} ${MiniPDF.n(this.H-y2)} l S${dash?' [] 0 d':''}`);}
  width(str,size=10,bold=false){const W=bold?PDF_W_BOLD:PDF_W_REG;return pdfCodes(str).reduce((s,c)=>s+(W[c]||556),0)*size/1000;}
  fit(str,maxW,size=10,bold=false){
    str=String(str??'');if(this.width(str,size,bold)<=maxW)return str;
    let s=str;while(s.length>1&&this.width(s+'…',size,bold)>maxW)s=s.slice(0,-1);
    return s.trimEnd()+'…';
  }
  text(str,x,y,{size=10,bold=false,color='#17202a',align='left',maxW}={}){
    if(maxW)str=this.fit(str,maxW,size,bold);
    const w=this.width(str,size,bold);
    if(align==='right')x-=w;else if(align==='center')x-=w/2;
    const enc=pdfCodes(str).map(c=>c===40||c===41||c===92?'\\'+String.fromCharCode(c):String.fromCharCode(c)).join('');
    this.cur.push(`BT /${bold?'F2':'F1'} ${size} Tf ${MiniPDF.rgb(color)} rg ${MiniPDF.n(x)} ${MiniPDF.n(this.H-y-size*0.8)} Td (${enc}) Tj ET`);
    return w;
  }
  output(){
    const objs=[];const add=s=>{objs.push(s);return objs.length;};
    add('<< /Type /Catalog /Pages 2 0 R >>');
    add(null); // Pages (preenchido depois)
    add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const kids=[];
    this.pages.forEach(p=>{
      const content=p.join('\n');
      const c=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`));
    });
    objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
    objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
    const xref=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
    return bytes;
  }
}
function pdfMoney(v){return money(v).replace(/\u00A0/g,' ');}
function pdfSignedMoney(v){return (v<0?'- ':'')+pdfMoney(Math.abs(v));}

function overdueBillsForSummary(){
  const today=new Date();
  today.setHours(0,0,0,0);
  const todayKey=today.toISOString().slice(0,10);
  return (db.transactions||[])
    .filter(t=>{
      if(!t || t.type!=='despesa' || !t.date) return false;
      if(t.confirmed===true) return false;
      return String(txCashDate(t)) <= todayKey;
    })
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}

function summaryMonthlyData(month){
  const visibleIds=new Set(summaryAccounts().map(a=>String(a.id)));
  const rows=(db.transactions||[]).filter(t=>txCashMonth(t)===month && visibleIds.has(String(t.accountId)));
  const confirmed=rows.filter(t=>t.confirmed===true);
  const income=confirmed.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.value||0),0);
  const expense=confirmed.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.value||0),0);
  return {rows,confirmed,income,expense,balance:income-expense};
}

  const visibleIds=new Set(summaryAccounts().map(a=>String(a.id)));
  return (db.transactions||[])
    .filter(t=>t.confirmed===true && visibleIds.has(String(t.accountId)) && txCashMonth(t)<=month)
    .reduce((s,t)=>s+(t.type==='receita'?1:-1)*Number(t.value||0),0);
}

function previousSummaryBalance(month){
  const [y,m]=month.split('-').map(Number);
  const prev=new Date(y,m-2,1);
  return summaryAccumulatedBalance(prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0'));
}

function summarySafeToSpend(month){
  const visibleIds=new Set(summaryAccounts().map(a=>String(a.id)));
  const [y,m]=month.split('-').map(Number);
  const monthEnd=`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
  const rows=(db.transactions||[]).filter(t=>String(txCashDate(t))<=monthEnd && visibleIds.has(String(t.accountId)));
  const balanceAll=rows.reduce((s,t)=>s+(t.type==='receita'?1:-1)*Number(t.value||0),0);
  const pendingExpenses=rows.filter(t=>t.confirmed!==true && t.type==='despesa').reduce((s,t)=>s+Number(t.value||0),0);
  return {value:Math.max(0,balanceAll),pendingExpenses};
}

function summaryExistingBalance(month){
  // O saldo existente do Resumo deve ser exatamente a soma dos saldos atuais
  // das contas que aparecem no Resumo. A tela Contas usa balance(), que considera
  // o saldo inicial + todas as movimentações confirmadas (independentemente da
  // data lançada). Mantemos a mesma regra aqui para evitar divergências.
  const visibleIds=new Set(summaryAccounts().map(a=>String(a.id)));
  return (db.accounts||[])
    .filter(a=>visibleIds.has(String(a.id)))
    .reduce((total,a)=>{
      const initial=Number(a.initialBalance ?? a.initial ?? 0);
      const confirmed=(db.transactions||[])
        .filter(t=>String(t.accountId)===String(a.id) && !t.cardId && t.confirmed===true)
        .reduce((s,t)=>s+(t.type==='receita'?1:-1)*Number(t.value||0),0);
      return total+initial+confirmed;
    },0);
}

function summaryClosingProjection(month){
  const now=new Date();
  const currentKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const visibleIds=new Set(summaryAccounts().map(a=>String(a.id)));
  const signed=t=>((t.type==='receita'?1:-1)*Number(t.value||0));
  const existing=summaryExistingBalance(month);

  if(month!==currentKey){
    const monthRows=(db.transactions||[]).filter(t=>txCashMonth(t)===month && visibleIds.has(String(t.accountId)));
    const projected=monthRows.reduce((s,t)=>s+signed(t),0);
    return {existing, futureKnown:0, projected, isCurrent:false};
  }

  const todayKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  // Como o saldo existente já inclui TODAS as movimentações confirmadas,
  // inclusive as que eventualmente tenham data futura, somente lançamentos
  // futuros ainda não confirmados devem ser acrescentados à projeção.
  const futureKnown=(db.transactions||[]).filter(t=>
    txCashMonth(t)===month && String(txCashDate(t))>todayKey &&
    visibleIds.has(String(t.accountId)) && t.confirmed!==true
  ).reduce((s,t)=>s+signed(t),0);

  return {existing, futureKnown, projected:existing+futureKnown, isCurrent:true};
}
function summaryPieGeometry(items){
  const total=items.reduce((s,x)=>s+Number(x.v||0),0);
  const cx=50,cy=50,r=45;
  let angle=-Math.PI/2;
  return items.map(x=>{
    const start=angle;
    const slice=total?Number(x.v||0)/total*Math.PI*2:0;
    angle+=slice;
    const end=angle;
    const x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
    const large=slice>Math.PI?1:0;
    const path=slice>=Math.PI*2-1e-8
      ? `M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx} ${cy+r} A ${r} ${r} 0 1 1 ${cx} ${cy-r} Z`
      : `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    return {...x,start,end,path,percent:total?Number(x.v||0)/total*100:0};
  });
}

function renderSummaryPie(items, selectedCat){
  const allItems=items||[];
  const activeItems=allItems.filter(x=>Number(x.v||0)>0);
  if(!activeItems.length) return '<div class="summary-pie-empty">Nenhuma despesa confirmada no mês.</div>';
  const geom=summaryPieGeometry(activeItems);
  const paths=geom.map((g,i)=>`<path d="${g.path}" fill="${g.c.color||categoryColor(g.c.id)}" onclick="filterSummaryCategory(${g.c.id})" title="${esc(g.c.name)} — ${money(g.v)} (${g.percent.toFixed(1)}%)" ${String(selectedCat)===String(g.c.id)?'opacity="0.72"':''}></path>`).join('');
  const legend=allItems.map(x=>{
    const v=Number(x.v||0), pct=activeItems.length&&v?((v/activeItems.reduce((s,y)=>s+Number(y.v||0),0))*100):0;
    return `<div class="summary-pie-legend-item ${String(selectedCat)===String(x.c.id)?'active':''}" onclick="filterSummaryCategory(${x.c.id})">
      <span class="summary-pie-dot" style="background:${x.c.color||categoryColor(x.c.id)}"></span>
      <span style="flex:1"><span class="category-icon">${esc(categoryIcon(x.c.id))}</span>${esc(x.c.name)}</span><b>${money(v)}</b>${v?`<span class="muted">${pct.toFixed(1)}%</span>`:''}
    </div>`;
  }).join('');
  return `<div class="summary-pie-wrap"><div class="summary-pie"><svg viewBox="0 0 100 100" role="img" aria-label="Despesas por classificação">${paths}</svg></div><div class="summary-pie-legend">${legend}</div></div>`;
}

window.txSort = window.txSort || {key:'date', dir:'desc'};

function txSortValue(t,key){
  const account=txAccountLabel(t)||'';
  const category=t.virtualCardStatement?'—':catName(t.categoryId)||'';
  switch(key){
    case 'date': return String(t.date||'');
    case 'description': return String(t.description||'').toLocaleLowerCase('pt-BR');
    case 'account': return String(account).toLocaleLowerCase('pt-BR');
    case 'category': return String(category).toLocaleLowerCase('pt-BR');
    case 'type': return String(t.type==='receita'?'Receita':'Despesa').toLocaleLowerCase('pt-BR');
    case 'value': return Number(t.value||0);
    case 'confirmed': return t.virtualCardStatement ? 2 : (t.confirmed?1:0);
    default: return '';
  }
}

function setTxSort(key){
  const current=window.txSort||{key:'date',dir:'desc'};
  window.txSort = current.key===key
    ? {key,dir:current.dir==='asc'?'desc':'asc'}
    : {key,dir:(key==='value'?'desc':'asc')};
  transactions();
}

function txSortIndicator(key){
  const s=window.txSort||{key:'date',dir:'desc'};
  if(s.key!==key) return '↕';
  return s.dir==='asc'?'↑':'↓';
}

function sortTransactions(rows){
  const s=window.txSort||{key:'date',dir:'desc'};
  return [...rows].sort((a,b)=>{
    const av=txSortValue(a,s.key), bv=txSortValue(b,s.key);
    let cmp=0;
    if(typeof av==='number' && typeof bv==='number') cmp=av-bv;
    else cmp=String(av).localeCompare(String(bv),'pt-BR',{numeric:true,sensitivity:'base'});
    if(cmp===0){
      // Stable secondary ordering: date, then id.
      const ad=String(a.date||''), bd=String(b.date||'');
      cmp=bd.localeCompare(ad);
      if(cmp===0) cmp=Number(a.id||0)-Number(b.id||0);
    }
    return s.dir==='asc'?cmp:-cmp;
  });
}

  const statementRows=(af==='all'&&cardf==='all'&&autof==='all'?cardStatementRows(k):[])

    cardGroups[key].items.push(t);
    const v=Number(t.value||0);

  });

    '<option value="despesa" '+(tf==='despesa'?'selected':'')+'>Despesas</option>';

    .reduce((s,t)=>s+(t.type==='receita'?1:-1)*Number(t.value||0),0);

async function confirmAccountMonthPending(accountId, monthKeyValue){
  const pending=db.transactions.filter(t=>String(t.accountId)===String(accountId)&&monthKey(t.date)===monthKeyValue&&t.confirmed!==true&&!t.virtualCardStatement);
  if(!pending.length){toast('Não há movimentações pendentes nesta conta e neste mês.');return;}
  const total=pending.reduce((sum,t)=>sum+Number(t.value||0),0);
  if(!confirm(`Confirmar ${pending.length} movimentação(ões) pendente(s) da conta \"${accountName(accountId)}\" em ${monthLabel(monthKeyValue)}?\n\nValor bruto dos lançamentos: ${money(total)}\n\nEssa ação incluirá os lançamentos no saldo confirmado da conta.`))return;
  pending.forEach(t=>{t.confirmed=true;});
  const saved=await save();
  if(saved){toast(`${pending.length} movimentação(ões) confirmada(s).`);render();}
}
